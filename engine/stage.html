<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "three/examples/jsm/": "/node_modules/three/examples/jsm/",
  "postprocessing": "/engine/vendor/postprocessing-6.39.5.js",
  "n8ao": "/engine/vendor/n8ao-2.0.1.js",
  "kit": "/engine/kit.js"
} }
</script>
<style>
  @font-face { font-family: 'Instrument Serif'; src: url(/assets/fonts/InstrumentSerif.woff2) format('woff2'); font-style: normal; }
  @font-face { font-family: 'Instrument Serif'; src: url(/assets/fonts/InstrumentSerif-Italic.woff2) format('woff2'); font-style: italic; }
  @font-face { font-family: 'Plex Mono'; src: url(/assets/fonts/IBMPlexMono-400.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Plex Mono'; src: url(/assets/fonts/IBMPlexMono-500.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: 'Archivo Narrow'; src: url(/assets/fonts/ArchivoNarrow.woff2) format('woff2'); font-weight: 400 700; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #gl { position: absolute; inset: 0; }
  #overlay { position: absolute; inset: 0; pointer-events: none; color: #ece6da; }
  #overlay * { box-sizing: border-box; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="overlay"></div>
<script type="module">
import * as THREE from 'three';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
const params = new URLSearchParams(location.search);
let scene, shots;

window.__setup = async (cfg) => {
  shots = cfg.shots;
  await document.fonts.load('40px "Instrument Serif"');
  await document.fonts.load('italic 40px "Instrument Serif"');
  await document.fonts.load('40px "Plex Mono"');
  await document.fonts.load('500 40px "Plex Mono"');
  await document.fonts.load('700 40px "Archivo Narrow"');
  const canvas = document.getElementById('gl');
  // aa: 'msaa' = 4x MSAA (very slow on CPU rasterizers), 'fxaa' = one cheap post pass, 'none'
  const aa = cfg.aa ?? 'msaa';
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: aa === 'msaa', preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  // renderScale < 1 renders the GL canvas smaller and lets CSS upscale it; the DOM overlay stays
  // full-res. Scenes that copy the canvas into a 2D comp must drawImage(gl, 0, 0, width, height).
  renderer.setPixelRatio(cfg.renderScale ?? 1);
  renderer.setSize(cfg.width, cfg.height, false);
  if (aa === 'fxaa') fxaa(renderer);
  canvas.style.width = cfg.width + 'px'; canvas.style.height = cfg.height + 'px';
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const overlay = document.getElementById('overlay');
  overlay.style.fontSize = (cfg.height / 1080 * 16) + 'px'; // 1em == 16px at 1080p, scales with draft size
  const mod = await import(params.get('project') + '/scene.js');
  // post.js quality override for every set: ?postq=draft|low|medium|high|off (e.g. STAGE_QS='&postq=off')
  const postQuality = params.get('postq') ?? undefined;
  scene = await mod.default({ THREE, renderer, overlay, postQuality, ...cfg });
};

// FXAA on the final, tone-mapped frame: after each render to the canvas, copy the drawing buffer
// into a texture and draw it back through FXAAShader. Renders into render targets (PMREM, etc.)
// pass through untouched, and scenes keep calling renderer.render() as before.
function fxaa(renderer) {
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const tex = new THREE.FramebufferTexture(size.x, size.y);
  tex.minFilter = tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  const mat = new THREE.ShaderMaterial({ ...FXAAShader, uniforms: THREE.UniformsUtils.clone(FXAAShader.uniforms), depthTest: false, depthWrite: false });
  mat.uniforms.tDiffuse.value = tex; mat.uniforms.resolution.value.set(1 / size.x, 1 / size.y);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  quad.frustumCulled = false;
  const render = renderer.render.bind(renderer);
  renderer.render = (scene, camera) => {
    render(scene, camera);
    if (renderer.getRenderTarget() !== null) return;
    renderer.copyFramebufferToTexture(tex);
    render(quad, cam);
  };
}

window.__frame = (T) => {
  let i = shots.findIndex(s => T >= s.start && T < s.start + s.duration);
  if (i < 0) i = shots.length - 1;
  const s = shots[i];
  const t = T - s.start;
  scene.frame({ T, shot: s, t, p: Math.min(1, t / s.duration), index: i });
};
</script>
</body>
</html>
