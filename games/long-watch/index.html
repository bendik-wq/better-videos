<title>Long Watch</title>
<meta name="description" content="First-person sniper game: clear armed hostiles from a tower overlooking the old quarter, holding over for drop and wind.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: full-bleed WebGL view; HUD pinned to the four corners like a spotter's instrument panel. Single dark look by design. */
:root {
  --ink: #0b0d0e;
  --panel: rgba(12, 14, 15, 0.82);
  --hud: #efe6d4;
  --dim: rgba(239, 230, 212, 0.58);
  --rule: rgba(239, 230, 212, 0.18);
  --amber: #f0a83a;
  --hostile: #e2483a;
  --civ: #8fb8de;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--hud); overflow: hidden; }
body { font-family: var(--display); -webkit-user-select: none; user-select: none; touch-action: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

#scope { position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 50% 50%, transparent 0, transparent calc(var(--r, 300px) * 0.82), rgba(0,0,0,0.38) calc(var(--r, 300px) - 2px), transparent var(--r, 300px)),
    radial-gradient(circle at 50% 50%, transparent 0, transparent calc(var(--r, 300px) - 1px), #050505 calc(var(--r, 300px) + 1px));
}
#reticle { position: absolute; inset: 0; width: 100%; height: 100%; }

#hud { position: fixed; inset: 0; pointer-events: none; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr auto; gap: 12px; }
.blk { display: grid; gap: 6px; align-content: start; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
.lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.val { font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.tl { grid-column: 1; grid-row: 1; }
.tr { grid-column: 3; grid-row: 1; justify-items: end; text-align: right; }
.bl { grid-column: 1; grid-row: 3; align-content: end; }
.bc { grid-column: 2; grid-row: 3; align-content: end; justify-items: center; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; }
.pips i { width: 10px; height: 14px; background: var(--hostile); clip-path: polygon(50% 0, 100% 30%, 100% 100%, 0 100%, 0 30%); }
.pips i.down { background: var(--rule); }
.ammo { display: flex; gap: 5px; align-items: end; }
.ammo i { width: 7px; height: 26px; border-radius: 3px 3px 1px 1px; background: linear-gradient(var(--amber) 0 34%, #b58a4a 34% 100%); }
.ammo i.spent { background: var(--rule); }
.ammo b { font-family: var(--mono); font-weight: 400; font-size: 14px; color: var(--dim); margin-left: 6px; }
#status { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; }
.meter { width: min(260px, 52vw); height: 6px; background: var(--rule); position: relative; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--amber); }
#expo i { background: linear-gradient(90deg, var(--amber), var(--hostile)); }
#breathWrap { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; pointer-events: none; }
#breathWrap .meter { width: 140px; height: 3px; }
#breathWrap .meter i { background: var(--hud); }
#calc { font-family: var(--mono); font-size: 14px; color: var(--amber); }
#hip { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%); pointer-events: none; }
#hip::before, #hip::after { content: ""; position: absolute; background: var(--hud); opacity: 0.8; }
#hip::before { left: 12px; top: 0; width: 2px; height: 26px; clip-path: polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%); }
#hip::after { top: 12px; left: 0; height: 2px; width: 26px; clip-path: polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%); }
#hitmark { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 34px; height: 34px; pointer-events: none; opacity: 0; transition: opacity .25s; }
#hitmark::before, #hitmark::after { content: ""; position: absolute; background: var(--hud); }
#hitmark::before { left: 16px; top: 0; width: 2px; height: 34px; clip-path: polygon(0 0,100% 0,100% 30%,0 30%,0 70%,100% 70%,100% 100%,0 100%); }
#hitmark::after { top: 16px; left: 0; height: 2px; width: 34px; clip-path: polygon(0 0,30% 0,30% 100%,0 100%,0 0,70% 0,100% 0,100% 100%,70% 100%); }
#hitmark.on { opacity: 1; transition: none; }
#hitmark.civ::before, #hitmark.civ::after { background: var(--hostile); }

#popups { position: fixed; left: 0; right: 0; top: 58%; display: grid; justify-items: center; gap: 4px; pointer-events: none; }
.pop { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 0.16em; text-transform: uppercase; animation: pop 1.8s ease-out forwards; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.pop span { font-family: var(--mono); font-weight: 400; color: var(--amber); letter-spacing: 0.04em; }
.pop.bad { color: var(--hostile); }
@keyframes pop { 0% { opacity: 0; transform: translateY(8px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

#menu { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 40%, rgba(11,13,14,0.35), rgba(11,13,14,0.88)); overflow: auto; }
.card { width: min(720px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--rule); padding: clamp(18px, 4vw, 34px); display: grid; gap: 18px; -webkit-user-select: text; user-select: text; box-sizing: border-box; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--amber); }
.card h1 { margin: 0; font-size: clamp(40px, 9vw, 76px); line-height: 0.92; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance; }
.card p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--dim); max-width: 62ch; font-family: var(--display); font-weight: 500; }
.card p strong { color: var(--hud); font-weight: 600; }
.ids { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.id { border-top: 2px solid var(--hostile); padding-top: 8px; display: grid; gap: 4px; min-width: 0; }
.id.c { border-color: var(--civ); }
.id b { font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; }
.id span { font-size: 14px; color: var(--dim); line-height: 1.4; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; color: var(--dim); }
.keys kbd { font-family: var(--mono); color: var(--hud); font-size: 13px; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; }
.stats div { display: grid; gap: 2px; border-left: 1px solid var(--rule); padding-left: 10px; }
.stats b { font-family: var(--mono); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button.go { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); background: var(--amber); border: 0; padding: 14px 28px; cursor: pointer; }
button.go:hover { background: #ffbb55; }
button.go:focus-visible, .tb:focus-visible { outline: 2px solid var(--hud); outline-offset: 3px; }
.note { font-family: var(--mono); font-size: 12px; color: var(--dim); }

#touch { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; }
.tb { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--rule); background: rgba(12,14,15,0.55); color: var(--hud); font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; touch-action: none; }
.tb.fire { grid-column: 2; grid-row: 1 / span 2; height: 138px; border-radius: 32px; background: rgba(226,72,58,0.45); }
.tb.on { background: rgba(240,168,58,0.5); }
@media (max-width: 600px) { .val { font-size: 16px; } #hud { grid-template-columns: 1fr 1fr; } .bc { grid-column: 1 / span 2; grid-row: 2; align-self: end; justify-items: start; } .tr { grid-column: 2; } }
@media (prefers-reduced-motion: reduce) { .pop { animation-duration: 2.4s; } }
</style>

<canvas id="gl"></canvas>
<div id="scope" hidden><canvas id="reticle"></canvas></div>
<div id="hip"></div>
<div id="hitmark"></div>
<div id="popups"></div>

<div id="hud" hidden>
  <div class="blk tl">
    <span class="lbl">Hostiles remaining</span>
    <div class="pips" id="pips"></div>
    <span class="lbl" style="margin-top:6px">Time on station</span>
    <span class="val" id="clock">5:00</span>
  </div>
  <div class="blk tr">
    <span class="lbl">Crosswind</span>
    <span class="val" id="wind">—</span>
    <span class="lbl" style="margin-top:6px">Rangefinder</span>
    <span class="val" id="range">—</span>
  </div>
  <div class="blk bl">
    <span id="status">READY</span>
    <div class="ammo" id="ammo"></div>
  </div>
  <div class="blk bc">
    <span class="lbl">Exposure</span>
    <div class="meter" id="expo"><i></i></div>
  </div>
</div>
<div id="breathWrap" hidden>
  <span id="calc">HOLD —</span>
  <div class="meter" id="breath"><i></i></div>
  <span class="lbl">Breath · Shift</span>
</div>

<div id="touch" hidden>
  <button class="tb" id="tScope">Scope</button>
  <button class="tb fire" id="tFire">Fire</button>
  <button class="tb" id="tBreath">Hold</button>
  <button class="tb" id="tZoom">Zoom</button>
  <button class="tb" id="tReload">Reload</button>
</div>

<div id="menu">
  <div class="card" id="card"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);

// ---------- ballistics ----------
const GRAV = 9.81, V0 = 860, ZERO = 100, WIND_K = 1.0;
const TAN_ZERO = 0.5 * GRAV * ZERO / (V0 * V0);
function holdFor(R, wind) {
  const t = R / V0;
  const drop = 0.5 * GRAV * t * t - TAN_ZERO * R;
  const drift = 0.5 * WIND_K * wind * t * t;
  return { up: drop / R * 1000, side: drift / R * 1000 };
}

// ---------- renderer / scene ----------
const canvas = $("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { $("card").innerHTML = '<h1>No WebGL</h1><p>This browser could not start WebGL, which the game needs. Try a current desktop browser.</p>'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const HORIZON = new THREE.Color("#d6a47c");
scene.fog = new THREE.Fog(HORIZON, 260, 1750);
scene.background = HORIZON;
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 5000);
camera.rotation.order = "YXZ";
scene.add(camera);

scene.add(new THREE.HemisphereLight("#a9bcd6", "#6e5038", 0.78));
const sun = new THREE.DirectionalLight("#ffc690", 1.05);
sun.position.set(-500, 260, 260);
scene.add(sun);

// sky dome
const sky = new THREE.Mesh(new THREE.SphereGeometry(3200, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color("#2f4466") }, mid: { value: new THREE.Color("#c88e6e") }, bot: { value: HORIZON }, sunDir: { value: new THREE.Vector3(-0.55, 0.12, -0.83).normalize() } },
  vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: "uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform vec3 sunDir; varying vec3 vP; void main(){ float h = vP.y; vec3 c = mix(mid, top, smoothstep(0.0, 0.5, h)); c = mix(bot, c, smoothstep(-0.01, 0.12, h)); float s = max(dot(normalize(vP), sunDir), 0.0); c += vec3(1.0, 0.72, 0.42) * (pow(s, 900.0) * 1.4 + pow(s, 12.0) * 0.25); gl_FragColor = vec4(c, 1.0); }"
}));
scene.add(sky);

// seeded rng for the town
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261006);

// textures
function canvasTex(size, draw) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const wallTex = canvasTex(64, (g) => {
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 220; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.06})`; g.fillRect(Math.random() * 64, Math.random() * 64, 2, 2); }
  g.fillStyle = "rgba(0,0,0,0.18)"; g.fillRect(19, 14, 26, 34);
  g.fillStyle = "#3a312a"; g.fillRect(22, 16, 20, 30);
  g.fillStyle = "rgba(0,0,0,0.22)"; g.fillRect(18, 46, 28, 3);
});
const groundTex = canvasTex(128, (g) => {
  g.fillStyle = "#c2a07a"; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 900; i++) { const v = Math.random(); g.fillStyle = v < 0.5 ? `rgba(90,62,38,${v * 0.25})` : `rgba(255,236,206,${(v - 0.5) * 0.25})`; g.fillRect(Math.random() * 128, Math.random() * 128, 1 + Math.random() * 3, 1 + Math.random() * 3); }
});
groundTex.repeat.set(400, 400);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshLambertMaterial({ map: groundTex }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// streets: grid of intersections that people walk between
const XS = [-240, -120, 0, 120, 240], ZS = [-100, -220, -340, -460, -580];
const XB = [-380, -240, -120, 0, 120, 240, 380], ZB = [-40, -100, -220, -340, -460, -580, -720];
const SW = 14;
const streetMat = new THREE.MeshLambertMaterial({ color: "#8e7b67" });
for (const x of XS) { const m = new THREE.Mesh(new THREE.PlaneGeometry(SW, 690), streetMat); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.03, -380); scene.add(m); }
for (const z of ZS) { const m = new THREE.Mesh(new THREE.PlaneGeometry(760, SW), streetMat); m.rotation.x = -Math.PI / 2; m.position.set(0, 0.04, z); scene.add(m); }

const solids = []; // everything a bullet can strike besides people and ground
const buildings = [];
const wallColors = ["#cdb59a", "#bfa58a", "#d8c7ad", "#a98f78", "#c9a98f", "#e0d2bb", "#b39a86"];
const wallMats = wallColors.map((c) => new THREE.MeshLambertMaterial({ color: c, map: wallTex }));
function boxUV(geo, w, h, d) {
  const uv = geo.attributes.uv;
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k;
    let u = uv.getX(i), v = uv.getY(i);
    if (f === 2 || f === 3) { u = 0.04; v = 0.04; }
    else { u *= (f < 2 ? d : w) / 4; v *= h / 3.6; }
    uv.setXY(i, u, v);
  }
}
function addBuilding(cx, cz, w, h, d, mat) {
  const geo = new THREE.BoxGeometry(w, h, d);
  boxUV(geo, w, h, d);
  const m = new THREE.Mesh(geo, mat || wallMats[Math.floor(rnd() * wallMats.length)]);
  m.position.set(cx, h / 2, cz);
  scene.add(m); solids.push(m);
  const b = { cx, cz, w, h, d }; buildings.push(b);
  return b;
}
const tankMat = new THREE.MeshLambertMaterial({ color: "#6f6a62" });
for (let i = 0; i < XB.length - 1; i++) for (let j = 0; j < ZB.length - 1; j++) {
  const x0 = XB[i] + SW / 2 + 2, x1 = XB[i + 1] - SW / 2 - 2;
  const z1 = ZB[j] - SW / 2 - 2, z0 = ZB[j + 1] + SW / 2 + 2;
  const near = j === 0;
  const lw = (x1 - x0) / 2, ld = (z1 - z0) / 2;
  for (let c = 0; c < 2; c++) for (let r = 0; r < 2; r++) {
    if (rnd() < 0.12) continue;
    const w = lw - 3 - rnd() * 6, d = ld - 3 - rnd() * 6;
    const h = near ? 4 + rnd() * 5 : (rnd() < 0.22 ? 15 + rnd() * 12 : 5 + rnd() * 10);
    const b = addBuilding(x0 + lw * (c + 0.5) + (rnd() - 0.5) * 2, z0 + ld * (r + 0.5) + (rnd() - 0.5) * 2, w, h, d);
    if (h > 8 && rnd() < 0.3) {
      const t = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 2.8, 12), tankMat);
      t.position.set(b.cx + (rnd() - 0.5) * w * 0.5, h + 2.4, b.cz + (rnd() - 0.5) * d * 0.5);
      const base = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1, 2.6), tankMat);
      base.position.set(t.position.x, h + 0.5, t.position.z);
      scene.add(t, base); solids.push(t, base);
    }
  }
}
// landmark minaret
{
  const m = new THREE.MeshLambertMaterial({ color: "#e4d6bf" });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 3.2, 46, 16), m); shaft.position.set(64, 23, -512);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(3.4, 7, 16), new THREE.MeshLambertMaterial({ color: "#5f7c7a" })); cap.position.set(64, 49.5, -512);
  scene.add(shaft, cap); solids.push(shaft, cap);
}
// parked cars along the streets: cover for the targets
const carColors = ["#7c2f26", "#d8d4c8", "#2e4a5e", "#5a5a52", "#c4a43a", "#3d5a3a"];
for (let i = 0; i < 46; i++) {
  const vertical = rnd() < 0.5;
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: carColors[Math.floor(rnd() * carColors.length)] });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 4.3), mat); body.position.y = 0.6;
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2.2), mat); cab.position.set(0, 1.3, -0.2);
  g.add(body, cab);
  if (vertical) { g.position.set(XS[Math.floor(rnd() * XS.length)] + (rnd() < 0.5 ? -5.2 : 5.2), 0, -60 - rnd() * 600); }
  else { g.position.set(-340 + rnd() * 680, 0, ZS[Math.floor(rnd() * ZS.length)] + (rnd() < 0.5 ? -5.2 : 5.2)); g.rotation.y = Math.PI / 2; }
  scene.add(g); solids.push(body, cab);
}
// distant ridgeline
{
  const m = new THREE.MeshLambertMaterial({ color: "#b78f7a", flatShading: true, fog: false });
  for (let i = 0; i < 18; i++) {
    const r = 260 + rnd() * 420, h = 140 + rnd() * 260;
    const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), m);
    const a = -Math.PI / 2 + (i / 17 - 0.5) * 2.6;
    c.position.set(Math.cos(a) * 2400, h / 2 - 10, Math.sin(a) * 2400);
    c.rotation.y = rnd() * 3;
    scene.add(c);
  }
}
// the player's tower
const EYE = new THREE.Vector3(0, 31.5, 27.5);
{
  const m = new THREE.MeshLambertMaterial({ color: "#9e8670" });
  const tower = new THREE.Mesh(new THREE.BoxGeometry(12, 30, 12), m); tower.position.set(0, 15, 32);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(12, 0.9, 0.5), new THREE.MeshLambertMaterial({ color: "#8d7560" })); lip.position.set(0, 30.45, 26.9);
  scene.add(tower, lip); solids.push(tower, lip);
}

// first-person rifle (hidden while scoped)
const rifle = new THREE.Group();
{
  const dark = new THREE.MeshLambertMaterial({ color: "#1f2022" });
  const wood = new THREE.MeshLambertMaterial({ color: "#5c4a37" });
  const stock = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.1, 0.62), wood); stock.position.set(0, -0.02, 0.05);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, 0.8, 10), dark); barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.02, -0.6);
  const scopeTube = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.34, 14), dark); scopeTube.rotation.x = Math.PI / 2; scopeTube.position.set(0, 0.085, -0.08);
  const bell = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.026, 0.1, 14), dark); bell.rotation.x = Math.PI / 2; bell.position.set(0, 0.085, -0.28);
  const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.08, 8), dark); bolt.rotation.z = Math.PI / 2; bolt.position.set(0.06, 0.03, 0.08);
  rifle.add(stock, barrel, scopeTube, bell, bolt);
  rifle.position.set(0.24, -0.26, -0.62);
  camera.add(rifle);
}

// ---------- people ----------
const GEO = {
  leg: new THREE.BoxGeometry(0.17, 0.88, 0.19),
  torso: new THREE.BoxGeometry(0.46, 0.62, 0.27),

tap("tFire", fire);

tap("tZoom", () => { zoomIdx = (zoomIdx + 1) % ZOOMS.length; if (scoped) setScope(true); });
tap("tReload", reload);
tap("tBreath", () => { holding = true; $("tBreath").classList.add("on"); });
$("tBreath").addEventListener("touchend", () => { holding = false; $("tBreath").classList.remove("on"); });

// ---------- menus ----------
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function showMenu(kind) {
  const card = $("card");
  const controls = isTouch
    ? `<div class="keys"><kbd>Drag</kbd><span>Look</span><kbd>Scope</kbd><span>Toggle the 4–16× scope; Zoom cycles power</span><kbd>Hold</kbd><span>Hold breath to steady the reticle</span><kbd>Fire</kbd><span>Take the shot. The bolt cycles between rounds</span></div>`
    : `<div class="keys"><kbd>Mouse</kbd><span>Look</span><kbd>Right click / Q</kbd><span>Toggle scope</span><kbd>Wheel / 1–4</kbd><span>Scope power 4× · 8× · 12× · 16×</span><kbd>Shift (hold)</kbd><span>Hold breath to steady the reticle</span><kbd>Left click / Space</kbd><span>Fire</span><kbd>R</kbd><span>Reload</span><kbd>Esc / P</kbd><span>Pause</span></div>`;
  const ids = `<div class="ids"><div class="id"><b>Hostile</b><span>Olive fatigues, red headband, carrying a rifle. Three are posted on rooftops.</span></div><div class="id c"><b>Civilian</b><span>Light clothes, unarmed. Hitting one costs 500 points and spikes your exposure.</span></div></div>`;
  const statBlock = () => `<div class="stats">
    <div><span class="lbl">Score</span><b>${stats.score}</b></div>
    <div><span class="lbl">Hostiles</span><b>${stats.hits}/${HOSTILES}</b></div>
    <div><span class="lbl">Accuracy</span><b>${stats.shots ? Math.round(stats.hits / stats.shots * 100) : 0}%</b></div>
    <div><span class="lbl">Headshots</span><b>${stats.heads}</b></div>
    <div><span class="lbl">Longest</span><b>${stats.longest} m</b></div>
    <div><span class="lbl">Time</span><b>${fmtTime(stats.time)}</b></div></div>`;
  if (kind === "start") {
    card.innerHTML = `<span class="eyebrow">Overwatch · Old Quarter · 30 m tower</span><h1>Long Watch</h1>
      <p>Nine armed hostiles are moving through the streets below your tower, mixed in with civilians. <strong>Clear all nine before your position is spotted or time runs out.</strong> Every shot raises your exposure, and alerted hostiles start searching for you.</p>
      ${ids}
      <p>Rifle zeroed at <strong>100 m</strong>, muzzle velocity <strong>860 m/s</strong>. Past 200 m the round drops and drifts in the wind. Range a target with the scope, then hold over using the mil dots. The scope's ballistic readout gives the hold.</p>
      ${controls}
      <div class="row"><button class="go" id="go">Deploy</button><span class="note">${isTouch ? "Best played on a larger screen." : "Click locks the mouse. Esc releases it."}</span></div>`;
  } else if (kind === "pause") {
    card.innerHTML = `<span class="eyebrow">Paused · ${fmtTime(Math.max(0, MISSION_TIME - T))} left</span><h1>Holding</h1>${controls}<div class="row"><button class="go" id="go">Resume</button></div>`;
  } else {
    const win = kind === "win";
    const why = win ? "All nine hostiles are down." : (exposure >= 100 ? "Your position was spotted. Exfil called." : "Time on station ran out.");
    card.innerHTML = `<span class="eyebrow">${win ? "Mission complete" : "Mission failed"}</span><h1>${win ? "Area clear" : "Compromised"}</h1><p>${why}${stats.civ ? ` ${stats.civ} civilian${stats.civ > 1 ? "s" : ""} hit.` : ""}</p>${statBlock()}<div class="row"><button class="go" id="go">Redeploy</button></div>`;
  }
  $("menu").hidden = false;
  $("go").onclick = () => {
    audio();
    if (kind !== "pause") resetMission();
    startPlay();
  };
  setTimeout(() => $("go")?.focus(), 0);
}
function startPlay() {
  state = "play";
  $("menu").hidden = true; $("hud").hidden = false; $("touch").hidden = !isTouch;
  setScope(scoped);
  if (!isTouch) requestLock();
}
function pause() {
  if (state !== "play") return;
  state = "paused"; holding = false; drag = null;
  if (locked()) document.exitPointerLock();
  showMenu("pause");
}
function end(win) {
  if (state !== "play") return;
  state = "over"; stats.time = T;
  if (locked()) document.exitPointerLock();
  setScope(false);
  $("hud").hidden = true; $("touch").hidden = true; $("hip").hidden = true;
  showMenu(win ? "win" : "fail");
}

// ---------- main loop ----------
const camRay = new THREE.Raycaster();
let hudT = 0;
function update(dt) {
  T += dt;
  // breath and sway
  if (winded > 0) winded -= dt;
  const steady = scoped && holding && breath > 0 && winded <= 0;
  if (steady) { breath -= dt / 5; if (breath <= 0) { breath = 0; winded = 2.5; } }
  else breath = Math.min(1, breath + dt / 4);
  const amp = !scoped ? 0.004 : steady ? 0.00035 : winded > 0 ? 0.0045 : 0.0018;
  const sx = amp * (Math.sin(T * 0.9) + 0.5 * Math.sin(T * 2.3 + 1));
  const sy = amp * (0.8 * Math.sin(T * 1.3 + 2) + 0.4 * Math.sin(T * 3.1));
  recoil *= Math.exp(-dt * 5);
  const kick = scoped ? 0.014 : 0.03;
  camera.rotation.y = yaw + sx + recoil * recoilSide * kick * 0.4;
  camera.rotation.x = pitch + sy + recoil * kick;
  rifle.position.z = -0.62 + recoil * 0.06;

  if (reloadEnd && T >= reloadEnd) { const n = Math.min(MAG - mag, reserve); mag += n; reserve -= n; reloadEnd = 0; canFireAt = T; }

  // wind drifts slowly
  if (Math.random() < dt / 8) windTarget = THREE.MathUtils.clamp(wind + (Math.random() - 0.5) * 2.4, -5, 5);
  wind += (windTarget - wind) * Math.min(1, dt * 0.4);

  for (const p of people) updatePerson(p, dt);

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let left = dt, done = false;
    while (left > 0 && !done) { const h = Math.min(left, 1 / 120); left -= h; b.t += h; done = stepBullet(b, h) || b.t > 3; }
    const pos = b.line.geometry.attributes.position;
    const tail = b.p.clone().addScaledVector(b.v, -0.03);
    if (tail.distanceToSquared(b.start) > b.p.distanceToSquared(b.start)) tail.copy(b.start);
    pos.setXYZ(0, tail.x, tail.y, tail.z); pos.setXYZ(1, b.p.x, b.p.y, b.p.z); pos.needsUpdate = true;
    b.line.geometry.computeBoundingSphere();
    if (done) { scene.remove(b.line); b.line.geometry.dispose(); bullets.splice(i, 1); }
  }
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt; const k = f.t / f.life;
    f.m.scale.setScalar(f.size * (1 + k * 4)); f.m.material.opacity = 0.85 * (1 - k); f.m.position.y += dt * 0.6;
    if (k >= 1) { scene.remove(f.m); f.m.geometry.dispose(); f.m.material.dispose(); fx.splice(i, 1); }
  }

  // exposure: alerted hostiles are hunting for your muzzle flash
  const hunting = people.filter((p) => p.alive && p.hostile && p.alert > 0).length;
  if (hunting) exposure += hunting * 2.2 * dt;
  else if (T - lastShotT > 3) exposure -= 2.5 * dt;
  exposure = THREE.MathUtils.clamp(exposure, 0, 100);
  if (exposure >= 100) end(false);
  if (T >= MISSION_TIME) end(false);

  hudT -= dt;
  if (hudT <= 0) { hudT = 0.08; updateHud(); }
}
function updateHud() {
  $("clock").textContent = fmtTime(Math.max(0, MISSION_TIME - T));
  const w = Math.abs(wind).toFixed(1);
  $("wind").textContent = wind >= 0 ? `${w} m/s →` : `← ${w} m/s`;
  $("ammo").innerHTML = Array.from({ length: MAG }, (_, i) => `<i class="${i < mag ? "" : "spent"}"></i>`).join("") + `<b>+${reserve}</b>`;
  const st = $("status");
  st.textContent = reloadEnd ? "RELOADING" : T < canFireAt ? "CYCLING BOLT" : mag > 0 ? "READY" : reserve > 0 ? "EMPTY · RELOAD" : "OUT OF AMMO";
  st.style.color = mag > 0 && !reloadEnd && T >= canFireAt ? "var(--hud)" : "var(--amber)";
  $("expo").firstElementChild.style.width = exposure + "%";
  $("breath").firstElementChild.style.width = (breath * 100) + "%";
  $("breath").firstElementChild.style.background = winded > 0 ? "var(--hostile)" : "var(--hud)";
  if (scoped) {
    camera.updateMatrixWorld();
    camRay.setFromCamera({ x: 0, y: 0 }, camera); camRay.far = 3000;
    const hits = camRay.intersectObjects([...solids, ground, ...people.map((p) => p.g)], true);
    if (hits.length) {
      const R = Math.round(hits[0].distance);
      $("range").textContent = `${R} m`;
      const h = holdFor(R, wind);
      const side = Math.abs(h.side) < 0.05 ? "" : ` · ${h.side > 0 ? "←" : "→"} ${Math.abs(h.side).toFixed(1)}`;
      $("calc").textContent = `HOLD ↑ ${Math.max(0, h.up).toFixed(1)}${side} MIL`;
    } else { $("range").textContent = "— m"; $("calc").textContent = "HOLD —"; }
  } else $("range").textContent = "— m";
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (scoped) drawReticle();
}
window.addEventListener("resize", resize);

camera.position.copy(EYE);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "play") update(dt);
  else if (state === "menu") { const t = now / 1000; camera.rotation.y = Math.sin(t * 0.05) * 0.35; camera.rotation.x = -0.06 + Math.sin(t * 0.07) * 0.02; for (const p of people) updatePerson(p, dt); }
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize();
resetMission();
scene.updateMatrixWorld(true);
$("hip").hidden = true;
showMenu("start");
requestAnimationFrame(frame);
})();
</script>
