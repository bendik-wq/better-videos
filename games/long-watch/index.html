<title>Long Watch</title>
<meta name="description" content="First-person sniper game: four missions, four rifles, and a real external-ballistics model with drag, wind, turrets and angle shooting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: full-bleed WebGL view; HUD pinned to the corners like a spotter's instrument panel. Single dark look by design. */
:root {
  --ink: #0b0d0e;
  --panel: rgba(12, 14, 15, 0.86);
  --hud: #efe6d4;
  --dim: rgba(239, 230, 212, 0.58);
  --rule: rgba(239, 230, 212, 0.18);
  --amber: #f0a83a;
  --hostile: #e2483a;
  --civ: #8fb8de;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--hud); overflow: hidden; }
body { font-family: var(--display); -webkit-user-select: none; user-select: none; touch-action: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
#gl.nv { filter: grayscale(1) sepia(1) hue-rotate(52deg) saturate(3.4) brightness(1.1) contrast(1.12); }
#nvNoise { position: fixed; inset: 0; pointer-events: none; opacity: 0.22; mix-blend-mode: screen; }

#scope { position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 50% 50%, transparent 0, transparent calc(var(--r, 300px) * 0.82), rgba(0,0,0,0.38) calc(var(--r, 300px) - 2px), transparent var(--r, 300px)),
    radial-gradient(circle at 50% 50%, transparent 0, transparent calc(var(--r, 300px) - 1px), #050505 calc(var(--r, 300px) + 1px));
}
#reticle { position: absolute; inset: 0; width: 100%; height: 100%; }

#hud { position: fixed; inset: 0; pointer-events: none; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr auto; gap: 12px; }
.blk { display: grid; gap: 6px; align-content: start; text-shadow: 0 1px 2px rgba(0,0,0,0.7); min-width: 0; }
.lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.val { font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.sub { font-family: var(--mono); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.tl { grid-column: 1; grid-row: 1; }
.tr { grid-column: 3; grid-row: 1; justify-items: end; text-align: right; }
.bl { grid-column: 1; grid-row: 3; align-content: end; }
.bc { grid-column: 2; grid-row: 3; align-content: end; justify-items: center; }
.br { grid-column: 3; grid-row: 3; align-content: end; justify-items: end; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; }
.pips i { width: 10px; height: 14px; background: var(--hostile); clip-path: polygon(50% 0, 100% 30%, 100% 100%, 0 100%, 0 30%); }
.pips i.down { background: var(--rule); }
.ammo { display: flex; gap: 4px; align-items: end; flex-wrap: wrap; }
.ammo i { width: 6px; height: 24px; border-radius: 3px 3px 1px 1px; background: linear-gradient(var(--amber) 0 34%, #b58a4a 34% 100%); }
.ammo i.spent { background: var(--rule); }
.ammo b { font-family: var(--mono); font-weight: 400; font-size: 14px; color: var(--dim); margin-left: 6px; }
#wname { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
#status { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; }
.meter { width: min(260px, 52vw); height: 6px; background: var(--rule); position: relative; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--amber); }
#expo i { background: linear-gradient(90deg, var(--amber), var(--hostile)); }
#dope { font-family: var(--mono); font-size: 12px; border-collapse: collapse; background: rgba(12,14,15,0.6); font-variant-numeric: tabular-nums; }
#dope th { font-weight: 400; color: var(--dim); letter-spacing: 0.1em; padding: 3px 8px; text-align: right; border-bottom: 1px solid var(--rule); }
#dope td { padding: 2px 8px; text-align: right; }
#dope td:first-child { color: var(--amber); }
#breathWrap { background: rgba(12,14,15,0.6); padding: 6px 12px; position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; pointer-events: none; text-shadow: 0 1px 2px #000; }
#breathWrap .meter { width: 140px; height: 3px; }
#breathWrap .meter i { background: var(--hud); }
#calc { font-family: var(--mono); font-size: 14px; color: var(--amber); }
#dial { font-family: var(--mono); font-size: 12px; color: var(--hud); }
#hip { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%); pointer-events: none; }
#hip::before, #hip::after { content: ""; position: absolute; background: var(--hud); opacity: 0.8; }
#hip::before { left: 12px; top: 0; width: 2px; height: 26px; clip-path: polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%); }
#hip::after { top: 12px; left: 0; height: 2px; width: 26px; clip-path: polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%); }
#hitmark { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 34px; height: 34px; pointer-events: none; opacity: 0; transition: opacity .25s; }
#hitmark::before, #hitmark::after { content: ""; position: absolute; background: var(--hud); }
#hitmark::before { left: 16px; top: 0; width: 2px; height: 34px; clip-path: polygon(0 0,100% 0,100% 30%,0 30%,0 70%,100% 70%,100% 100%,0 100%); }
#hitmark::after { top: 16px; left: 0; height: 2px; width: 34px; clip-path: polygon(0 0,30% 0,30% 100%,0 100%,0 0,70% 0,100% 0,100% 100%,70% 100%); }
#hitmark.on { opacity: 1; transition: none; }
#hitmark.civ::before, #hitmark.civ::after { background: var(--hostile); }

#popups { position: fixed; left: 0; right: 0; top: 58%; display: grid; justify-items: center; gap: 4px; pointer-events: none; }
.pop { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 0.16em; text-transform: uppercase; animation: pop 1.8s ease-out forwards; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.pop span { font-family: var(--mono); font-weight: 400; color: var(--amber); letter-spacing: 0.04em; }
.pop.bad { color: var(--hostile); }
@keyframes pop { 0% { opacity: 0; transform: translateY(8px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

#menu { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 40%, rgba(11,13,14,0.35), rgba(11,13,14,0.9)); overflow: auto; }
.card { width: min(980px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--rule); padding: clamp(18px, 3.5vw, 32px); display: grid; gap: 16px; box-sizing: border-box; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--amber); }
.card h1 { margin: 0; font-size: clamp(38px, 8vw, 70px); line-height: 0.92; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance; }
.card h2 { margin: 6px 0 0; font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.card p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--dim); max-width: 70ch; font-weight: 500; }
.card p strong { color: var(--hud); font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.opt { text-align: left; font: inherit; color: var(--hud); background: rgba(239,230,212,0.04); border: 1px solid var(--rule); padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; align-content: start; min-width: 0; }
.opt:hover { background: rgba(239,230,212,0.08); }
.opt[aria-pressed="true"] { border-color: var(--amber); background: rgba(240,168,58,0.1); box-shadow: inset 3px 0 0 var(--amber); }
.opt b { font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; }
.opt small { font-family: var(--mono); font-size: 12px; color: var(--dim); line-height: 1.4; }
.opt .spec { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-family: var(--mono); font-size: 12px; margin-top: 4px; }
.opt .spec span:nth-child(odd) { color: var(--dim); }
.opt .best { color: var(--amber); }
.ids { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.id { border-top: 2px solid var(--hostile); padding-top: 8px; display: grid; gap: 4px; min-width: 0; }
.id.c { border-color: var(--civ); }
.id b { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
.id span { font-size: 14px; color: var(--dim); line-height: 1.4; }
details { color: var(--dim); font-size: 14px; }
summary { cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--hud); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; color: var(--dim); margin-top: 10px; }
.keys kbd { font-family: var(--mono); color: var(--hud); font-size: 13px; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; }
.stats div { display: grid; gap: 2px; border-left: 1px solid var(--rule); padding-left: 10px; }
.stats b { font-family: var(--mono); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button.go, button.ghost { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; border: 0; padding: 14px 26px; cursor: pointer; }
button.go { color: var(--ink); background: var(--amber); }
button.go:hover { background: #ffbb55; }
button.ghost { color: var(--hud); background: transparent; border: 1px solid var(--rule); }
button.ghost:hover { border-color: var(--hud); }
button:focus-visible, .tb:focus-visible { outline: 2px solid var(--hud); outline-offset: 3px; }
.note { font-family: var(--mono); font-size: 12px; color: var(--dim); }

#touch { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 60px); gap: 10px; }
.tb { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--rule); background: rgba(12,14,15,0.55); color: var(--hud); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; touch-action: none; }
.tb.fire { grid-column: 2; grid-row: 1 / span 2; height: 130px; border-radius: 30px; background: rgba(226,72,58,0.45); }
.tb.on { background: rgba(240,168,58,0.5); }
@media (max-width: 760px) { .br { display: none; } }
@media (max-width: 600px) { .val { font-size: 16px; } #hud { grid-template-columns: 1fr 1fr; } .bc { grid-column: 1 / span 2; grid-row: 2; align-self: end; justify-items: start; } .tr { grid-column: 2; } }
@media (prefers-reduced-motion: reduce) { .pop { animation-duration: 2.4s; } }
</style>

  <div class="blk tl">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pick = (a, r = Math.random) => a[Math.floor(r() * a.length)];
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = {
  get(k, d) { try { const v = localStorage.getItem("longwatch." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("longwatch." + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

// ================= rifles =================
// Drag uses dv/dt = -c·|v_air|·v_air, so wind drift falls out of the physics (drift = wind × lag time).
const GRAV = 9.81, SIGHT_H = 0.045, ZERO = 100, STEP = 1 / 240;
const WEAPONS = [
  { id: "m24", name: "M24 SWS", cal: "7.62×51 mm M118LR", action: "Bolt action", v0: 790, c: 0.00068, mag: 5, reserve: 25, cycle: 1.3, reload: 3.0, zooms: [4, 6, 10, 14], loud: 8, kick: 1, sway: 1, eff: 800, snd: { f: 2400, v: 0.9, boom: 90 } },
  { id: "mk11", name: "Mk 11 Mod 0", cal: "7.62×51 mm, suppressed", action: "Semi-auto", v0: 760, c: 0.00069, mag: 10, reserve: 30, cycle: 0.32, reload: 2.5, zooms: [3, 6, 9], loud: 3.5, kick: 0.8, sway: 1.15, eff: 600, suppressed: true, snd: { f: 1300, v: 0.35, boom: 0 } },
  { id: "l115", name: "L115A3", cal: ".338 Lapua Magnum", action: "Bolt action", v0: 905, c: 0.00043, mag: 5, reserve: 20, cycle: 1.5, reload: 3.2, zooms: [5, 10, 15, 25], loud: 11, kick: 1.5, sway: 1.05, eff: 1400, snd: { f: 2100, v: 1, boom: 75 } },
  { id: "m82", name: "M82A1", cal: "12.7×99 mm (.50 BMG)", action: "Semi-auto", v0: 853, c: 0.00046, mag: 10, reserve: 20, cycle: 0.55, reload: 3.8, zooms: [4, 8, 10], loud: 15, kick: 2.8, sway: 1.35, eff: 1800, pen: true, snd: { f: 1700, v: 1, boom: 55 } },
];
function simulate(w, ang, windX, maxR) {
  let px = 0, py = -SIGHT_H, pz = 0, t = 0;
  let vx = 0, vy = w.v0 * Math.sin(ang), vz = w.v0 * Math.cos(ang);
  const up = [0], lat = [0], tof = [0]; let next = 10;
  while (pz < maxR && t < 9) {
    const rx = vx - windX, sp = Math.hypot(rx, vy, vz);
    vx += -w.c * sp * rx * STEP; vy += (-w.c * sp * vy - GRAV) * STEP; vz += -w.c * sp * vz * STEP;
    const ox = px, oy = py, oz = pz;
    px += vx * STEP; py += vy * STEP; pz += vz * STEP; t += STEP;
    while (pz >= next) { const f = (next - oz) / (pz - oz); up.push(oy + (py - oy) * f); lat.push(ox + (px - ox) * f); tof.push(t - STEP + STEP * f); next += 10; }
  }
  return { up, lat, tof };
}
for (const w of WEAPONS) {
  let ang = 0;
  for (let k = 0; k < 8; k++) ang += -simulate(w, ang, 0, 101).up[10] / ZERO;
  w.zeroAng = ang;
  w.still = simulate(w, ang, 0, 2000);
  w.windy = simulate(w, ang, 1, 2000);
}
function tableAt(arr, R) { const i = R / 10, a = Math.floor(i), b = Math.min(a + 1, arr.length - 1); if (a >= arr.length - 1) return arr[arr.length - 1]; return arr[a] + (arr[b] - arr[a]) * (i - a); }
function dope(w, R) {
  if (R < 5) return { up: 0, wind: 0, tof: 0 };
  return { up: -tableAt(w.still.up, R) / R * 1000, wind: tableAt(w.windy.lat, R) / R * 1000, tof: tableAt(w.still.tof, R) };
}

// ================= missions =================
const LEVELS = [
  { id: "quarter", name: "Old Quarter", map: "town", seed: 20261006, when: "Dusk · clear", band: "120–720 m",
    brief: "Nine armed hostiles are moving through the streets below your tower, mixed in with civilians. Three are posted on rooftops.",
    hostiles: 9, pacers: 3, civilians: 11, time: 300, wind: [1, 4.5],
    hostileLook: "Olive fatigues, red headband, carrying a rifle.", civLook: "Light clothes, unarmed.",
    sky: { top: "#2f4466", mid: "#c88e6e", bot: "#d6a47c", fog: [260, 1750], hemi: ["#a9bcd6", "#6e5038", 0.78], sun: ["#ffc690", 1.05, [-500, 260, 260]], disk: [-0.55, 0.12, -0.83, 1] } },
  { id: "docks", name: "Container Port", map: "docks", seed: 77, when: "Morning · overcast, sea wind", band: "150–850 m",
    brief: "A cell is moving weapons through the container yard. Ten hostiles, three of them watching from the top of the stacks. Dock workers are still on shift. Expect a strong crosswind off the water.",
    hostiles: 10, pacers: 3, civilians: 8, time: 330, wind: [3, 7.5],
    hostileLook: "Black jackets, red headband, carrying rifles.", civLook: "Dock workers in orange or yellow hi-vis.",
    sky: { top: "#6d7a86", mid: "#9aa6ae", bot: "#aeb7bc", fog: [180, 1400], hemi: ["#c8d2da", "#4f4a44", 0.95], sun: ["#e8eef2", 0.55, [200, 400, 100]], disk: [0.2, 0.5, -0.8, 0] } },
  { id: "blackout", name: "Blackout", map: "town", seed: 4411, night: true, when: "Night · curfew", band: "120–720 m",
    brief: "The same quarter after the power was cut. Eight hostiles carry torches through the dark streets. Few civilians are out. Your scope has night vision; press N to switch it.",
    hostiles: 8, pacers: 2, civilians: 4, time: 300, wind: [0.5, 3],
    hostileLook: "Olive fatigues, red headband, rifle and a lit torch.", civLook: "Light clothes, unarmed, no torch.",
    sky: { top: "#03050a", mid: "#0a1020", bot: "#141b28", fog: [70, 800], hemi: ["#3a4a6a", "#0d0b09", 0.22], sun: ["#a8b8ff", 0.25, [300, 400, -500]], disk: [0.3, 0.35, -0.88, 0.5],
      nv: { hemi: 1.05, sun: 0.6, fog: [160, 1200] } } },
  { id: "pass", name: "Highland Pass", map: "pass", seed: 9031, when: "Midday · snow, mountain wind", band: "400–1400 m",
    brief: "A convoy camp sits on the valley road under your ridge. Nine hostiles in snow camouflage: four guard the camp, the rest patrol the road. Shepherds use the same road. These are the longest shots in the game.",
    hostiles: 9, pacers: 4, civilians: 3, time: 360, wind: [2, 6.5],
    hostileLook: "White snow camouflage, red headband, carrying rifles.", civLook: "Shepherds in brown and grey wool.",
    sky: { top: "#3d6fb0", mid: "#9cc0e4", bot: "#dfe8f0", fog: [700, 3600], hemi: ["#dfeaff", "#8a8580", 0.62], sun: ["#fff6e6", 0.72, [300, 600, -200]], disk: [0.35, 0.55, -0.75, 1] } },
];

// ================= renderer / scene =================
const canvas = $("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { $("card").innerHTML = '<h1>No WebGL</h1><p>This browser could not start WebGL, which the game needs. Try a current desktop browser.</p>'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.Fog("#ffffff", 200, 1500);
scene.background = new THREE.Color("#000000");
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 6000);
camera.rotation.order = "YXZ";
scene.add(camera);
const hemi = new THREE.HemisphereLight("#ffffff", "#444444", 1);
const sun = new THREE.DirectionalLight("#ffffff", 1);
scene.add(hemi, sun);
const skyU = { top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, bot: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3(0, 0.3, -1) }, sunK: { value: 1 } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(3400, 32, 16), new THREE.ShaderMaterial({

  if (T >= L.time) end(false);
  hudT -= dt;
  if (hudT <= 0) { hudT = 0.08; updateHud(); }
}
function updateFlags() {
  const a = Math.abs(wind), droop = -(1 - Math.min(1, a / 8)) * 1.25;
  for (const f of flags) {
    f.yawG.rotation.y = wind >= 0 ? 0 : Math.PI;
    f.droop.rotation.z = droop;
    const p = f.geo.attributes.position;
    for (let i = 0; i < p.count; i++) { const x = f.base[i * 3]; p.setZ(i, Math.sin(T * (4 + a) + x * 2.6 + f.ph) * 0.11 * x * (0.3 + a / 6)); }
    p.needsUpdate = true;
  }
}
function holdText(R, ang) {
  const cross = wind * Math.cos(yaw);
  const d = dope(W, R * Math.cos(ang));
  const up = d.up - dialE, side = -d.wind * cross - dialW;
  const v = up >= 0 ? `↑ ${up.toFixed(1)}` : `↓ ${(-up).toFixed(1)}`;
  const h = Math.abs(side) < 0.05 ? "" : ` · ${side < 0 ? "←" : "→"} ${Math.abs(side).toFixed(1)}`;
  return `HOLD ${v}${h} MIL · ${d.tof.toFixed(2)} s`;
}
function updateHud() {
  $("clock").textContent = fmtTime(Math.max(0, L.time - T));
  const wv = realistic() ? `~${Math.round(Math.abs(windBase))}` : Math.abs(wind).toFixed(1);
  $("wind").textContent = wind >= 0 ? `${wv} m/s →` : `← ${wv} m/s`;
  $("ammo").innerHTML = Array.from({ length: W.mag }, (_, i) => `<i class="${i < mag ? "" : "spent"}"></i>`).join("") + `<b>+${reserve}</b>`;
  const st = $("status");
  st.textContent = reloadEnd ? "RELOADING" : T < canFireAt ? (W.action === "Bolt action" ? "CYCLING BOLT" : "RECOVERING") : mag > 0 ? "READY" : reserve > 0 ? "EMPTY · RELOAD" : "OUT OF AMMO";
  st.style.color = mag > 0 && !reloadEnd && T >= canFireAt ? "var(--hud)" : "var(--amber)";
  $("expo").firstElementChild.style.width = exposure + "%";
  $("breath").firstElementChild.style.width = (breath * 100) + "%";
  $("breath").firstElementChild.style.background = winded > 0 ? "var(--hostile)" : "var(--hud)";
  $("dial").textContent = `DIAL ELEV ${dialE.toFixed(1)} · WIND ${dialW < 0 ? "L" : dialW > 0 ? "R" : ""}${Math.abs(dialW).toFixed(1)} MIL`;
  const m = realistic() ? lazed : scoped ? measure() : null;
  if (m) {
    $("range").textContent = `${m.R} m`;
    const deg = m.ang * 180 / Math.PI;
    $("angle").textContent = `${deg >= 0 ? "+" : "−"}${Math.abs(deg).toFixed(1)}° · cos ${Math.cos(m.ang).toFixed(3)}`;
    $("calc").textContent = realistic() ? "" : holdText(m.R, m.ang);
  } else { $("range").textContent = "— m"; $("angle").textContent = ""; $("calc").textContent = realistic() ? "" : "HOLD —"; }
  $("calc").hidden = realistic();
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (scoped) drawReticle();
}
window.addEventListener("resize", resize);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "play") update(dt);
  else if (state === "menu") {
    T += dt;
    camera.rotation.y = yaw0 + Math.sin(now / 20000) * 0.35; camera.rotation.x = (L.map === "pass" ? -0.1 : -0.06) + Math.sin(now / 14000) * 0.02;
    for (const p of people) updatePerson(p, dt);
  }
  if (state === "play" || state === "menu") updateFlags();
  if (!$("nvNoise").hidden) $("nvNoise").style.backgroundPosition = `${Math.random() * 160}px ${Math.random() * 160}px`;
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize();
resetMission();
showMenu("start");
requestAnimationFrame(frame);
})();
</script>
