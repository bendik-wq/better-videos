<title>Cold Block</title>
<meta name="description" content="Multiplayer first-person shooter in an open city: join a server with friends, pick up Cold War guns, steal cars.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D view; Cold War field-manual HUD — stencilled condensed caps, olive and signal orange. Single dark look by design. */
:root {
  --ink: #0d0f0c;
  --panel: rgba(16, 18, 14, 0.88);
  --hud: #ece6d6;
  --dim: rgba(236, 230, 214, 0.6);
  --rule: rgba(236, 230, 214, 0.2);
  --signal: #f07d2a;
  --olive: #8d9a5b;
  --red: #d8392b;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--hud); overflow: hidden; }
body { font-family: var(--display); -webkit-user-select: none; user-select: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; filter: contrast(1.08) saturate(0.82) sepia(0.12); }
#grain { position: fixed; inset: -50%; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay; }
#vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%); }
#hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(140,0,0,0.75) 100%); }
#scope { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, transparent 0, transparent calc(min(46vw, 46vh) - 1px), #050505 min(46vw, 46vh)); }
#scope::before, #scope::after { content: ""; position: absolute; background: #050505; }
#scope::before { left: 50%; top: 0; bottom: 0; width: 1px; }
#scope::after { top: 50%; left: 0; right: 0; height: 1px; }

#hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.85); }
#mini { position: absolute; left: 16px; top: 16px; width: 168px; height: 168px; border-radius: 50%; border: 2px solid rgba(236,230,214,0.35); background: #1b1d18; }
#srv { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--dim); white-space: nowrap; }
#srv b { color: var(--olive); font-weight: 500; }
#srv b.off { color: var(--signal); }
#feed { position: absolute; right: 16px; top: 14px; display: grid; gap: 3px; justify-items: end; font-size: 16px; font-weight: 600; letter-spacing: 0.04em; }
#feed div { background: rgba(0,0,0,0.35); padding: 2px 8px; animation: fade 6s forwards; }
#feed .w { font-family: var(--mono); font-size: 12px; color: var(--signal); padding: 0 6px; }
@keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
#chat { position: absolute; left: 16px; bottom: 120px; display: grid; gap: 2px; font-family: var(--mono); font-size: 13px; max-width: min(460px, 70vw); }
#chat div { animation: fade 12s forwards; overflow-wrap: anywhere; }
#chat div.sys { color: var(--dim); }
#chatIn { position: absolute; left: 16px; bottom: 88px; width: min(420px, 70vw); pointer-events: auto; font: 14px var(--mono); color: var(--hud); background: rgba(0,0,0,0.6); border: 1px solid var(--rule); padding: 6px 8px; }
#weap { position: absolute; right: 20px; bottom: 18px; text-align: right; display: grid; gap: 0; }
#weap .n { font-size: 18px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
#weap .a { font-size: 46px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
#weap .a small { font-size: 22px; color: var(--dim); }
#weap .s { font-family: var(--mono); font-size: 12px; color: var(--signal); letter-spacing: 0.1em; min-height: 16px; }
#slots { display: flex; gap: 4px; justify-content: flex-end; margin-top: 4px; }
#slots span { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border: 1px solid var(--rule); color: var(--dim); }
#slots span.on { border-color: var(--signal); color: var(--hud); }
#stats { position: absolute; left: 20px; bottom: 18px; display: grid; gap: 4px; }
#hp { width: 200px; height: 6px; background: rgba(236,230,214,0.18); }
#hp i { display: block; height: 100%; width: 100%; background: var(--hud); }
#kd { font-family: var(--mono); font-size: 13px; color: var(--dim); }
#kd b { color: var(--hud); font-weight: 500; }
#mode { font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--olive); }
#xh { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#xh i { position: absolute; background: var(--hud); box-shadow: 0 0 2px #000; }
#xh i:nth-child(1), #xh i:nth-child(2) { width: 2px; height: 9px; left: -1px; }
#xh i:nth-child(3), #xh i:nth-child(4) { height: 2px; width: 9px; top: -1px; }
#dot { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: #ff3b2a; box-shadow: 0 0 4px #ff3b2a; }
#hitm { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; transform: translate(-50%,-50%) rotate(45deg); opacity: 0; }
#hitm::before, #hitm::after { content: ""; position: absolute; background: var(--hud); }
#hitm::before { left: 14px; top: 0; width: 2px; height: 30px; clip-path: polygon(0 0,100% 0,100% 33%,0 33%,0 67%,100% 67%,100% 100%,0 100%); }
#hitm::after { top: 14px; left: 0; height: 2px; width: 30px; clip-path: polygon(0 0,33% 0,33% 100%,0 100%,0 0,67% 0,100% 0,100% 100%,67% 100%); }
#hitm.on { opacity: 1; }
#hitm.kill::before, #hitm.kill::after { background: var(--red); }
#center { position: absolute; left: 0; right: 0; top: 60%; display: grid; justify-items: center; gap: 4px; }
.big { font-size: 22px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; animation: rise 1.6s ease-out forwards; }
.big span { color: var(--signal); }
@keyframes rise { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
#prompt { position: absolute; left: 50%; top: 66%; transform: translateX(-50%); font-size: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; background: rgba(0,0,0,0.45); padding: 4px 12px; }
#prompt kbd { font-family: var(--mono); color: var(--signal); }
#deathMsg { position: absolute; left: 0; right: 0; top: 34%; text-align: center; display: grid; gap: 6px; }
#deathMsg b { font-size: 44px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
#deathMsg span { font-size: 18px; letter-spacing: 0.1em; color: var(--dim); }
#dirs { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#dirs i { position: absolute; left: -40px; top: -150px; width: 80px; height: 20px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; border-top: 5px solid rgba(216,57,43,0.9); transform-origin: 40px 150px; animation: fade 1.6s forwards; }
#carhud { position: absolute; right: 20px; bottom: 18px; text-align: right; }
#carhud b { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; }
#carhud span { font-size: 16px; letter-spacing: 0.12em; color: var(--dim); }

#board { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); width: min(620px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--rule); padding: 16px 20px; pointer-events: none; }
#board h3 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; }
#board table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
#board th { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: var(--dim); text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--rule); }
#board th:first-child, #board td:first-child { text-align: left; }
#board td { font-size: 18px; font-weight: 600; padding: 4px 6px; text-align: right; }
#board tr.me td { color: var(--signal); }
#board td i { display: inline-block; width: 10px; height: 10px; margin-right: 8px; }

#menu { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 40%, rgba(13,15,12,0.4), rgba(13,15,12,0.92)); overflow: auto; }
.card { width: min(860px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--rule); padding: clamp(18px, 3.5vw, 32px); display: grid; gap: 16px; box-sizing: border-box; -webkit-user-select: text; user-select: text; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--signal); }
.card h1 { margin: 0; font-size: clamp(52px, 11vw, 104px); line-height: 0.85; font-weight: 800; letter-spacing: 0.01em; text-transform: uppercase; }
.card h2 { margin: 4px 0 0; font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.card p { margin: 0; font-size: 17px; line-height: 1.45; color: var(--dim); max-width: 68ch; font-weight: 500; }
.card p strong { color: var(--hud); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.field input[type=text] { font: 600 20px var(--display); letter-spacing: 0.04em; color: var(--hud); background: rgba(236,230,214,0.06); border: 1px solid var(--rule); padding: 10px 12px; min-width: 0; }
.field input[type=text]:focus { outline: none; border-color: var(--signal); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 34px; height: 34px; border: 2px solid transparent; cursor: pointer; }
.swatches button[aria-pressed="true"] { border-color: var(--hud); outline: 2px solid var(--ink); outline-offset: -4px; }
.servers { display: grid; gap: 6px; }
.servers button { display: flex; justify-content: space-between; gap: 12px; font: 600 18px var(--display); letter-spacing: 0.06em; color: var(--hud); background: rgba(236,230,214,0.05); border: 1px solid var(--rule); padding: 8px 12px; cursor: pointer; text-align: left; }
.servers button:hover { border-color: var(--hud); }
.servers button span { font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--olive); }
.servers .empty { font-family: var(--mono); font-size: 13px; color: var(--dim); }
.check { display: flex; gap: 10px; align-items: center; font-size: 17px; color: var(--hud); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--signal); }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 18px; font-size: 16px; color: var(--dim); }
.keys div { display: flex; gap: 10px; }
.keys kbd { font-family: var(--mono); font-size: 12px; color: var(--hud); min-width: 76px; padding-top: 2px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button.go, button.ghost { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; border: 0; padding: 12px 30px; cursor: pointer; }
button.go { color: var(--ink); background: var(--signal); }
button.go:hover { background: #ff9447; }
button.ghost { color: var(--hud); background: transparent; border: 1px solid var(--rule); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--hud); outline-offset: 2px; }
.net { font-family: var(--mono); font-size: 13px; color: var(--dim); }
.net b { font-weight: 500; color: var(--olive); }
.net b.off { color: var(--signal); }
details summary { cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--hud); }
details .keys { margin-top: 10px; }
@media (max-width: 640px) { #mini { width: 120px; height: 120px; } #weap .a { font-size: 34px; } #srv { top: 150px; left: 16px; transform: none; } }
@media (prefers-reduced-motion: reduce) { .big { animation-duration: 2.2s; } }
</style>

<canvas id="gl"></canvas>
<div id="grain"></div>
<div id="vig"></div>
<div id="hurt"></div>
<div id="scope" hidden></div>

<div id="hud" hidden>
  <canvas id="mini" width="336" height="336"></canvas>
  <div id="srv"></div>
  <div id="feed"></div>
  <div id="chat"></div>
  <input id="chatIn" type="text" maxlength="120" placeholder="Say something · Enter to send · Esc to cancel" hidden>
  <div id="stats">
    <span id="mode">Deathmatch</span>
    <div id="hp"><i></i></div>
    <span id="kd"></span>
  </div>
  <div id="weap">
    <span class="n" id="wName">AK-47</span>
    <span class="a" id="wAmmo">30 <small>/ ∞</small></span>
    <span class="s" id="wState"></span>
    <div id="slots"></div>
  </div>
  <div id="carhud" hidden><b id="kmh">0</b> <span>km/h</span></div>
  <div id="xh"><i></i><i></i><i></i><i></i></div>
  <div id="dot" hidden></div>
  <div id="hitm"></div>
  <div id="dirs"></div>
  <div id="center"></div>
  <div id="prompt" hidden></div>
  <div id="deathMsg" hidden><b>Killed</b><span id="deathBy"></span></div>
</div>
<div id="board" hidden><h3 id="boardTitle">Server</h3><table><thead><tr><th>Player</th><th>Kills</th><th>Deaths</th><th>Score</th></tr></thead><tbody id="boardBody"></tbody></table></div>

<div id="menu"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, lo, hi, d = 0) => (typeof v === "number" && isFinite(v) ? clamp(v, lo, hi) : d);
const r2 = (v) => Math.round(v * 100) / 100;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = {
  get(k, d) { try { const v = localStorage.getItem("coldblock." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("coldblock." + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};
const COLORS = ["#d8392b", "#f07d2a", "#e6c34a", "#8d9a5b", "#3f9a8a", "#4b7fc4", "#8a63c9", "#d9d4c7"];
const cleanName = (s) => String(s || "").replace(/[^\p{L}\p{N} _.\-]/gu, "").trim().slice(0, 16);
const cleanSrv = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 20);

// ================= renderer =================
const canvas = $("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { $("card").innerHTML = "<h1>No WebGL</h1><p>This browser could not start WebGL, which the game needs. Try a current desktop browser.</p>"; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
const scene = new THREE.Scene();
const FOG = new THREE.Color("#b79c80");
scene.fog = new THREE.Fog(FOG, 90, 520);
scene.background = FOG;
const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 2000);
camera.rotation.order = "YXZ";
scene.add(camera);
scene.add(new THREE.HemisphereLight("#b4c2d0", "#5a4a3a", 0.75));
const sun = new THREE.DirectionalLight("#ffd2a0", 0.95); sun.position.set(-300, 220, 160); scene.add(sun);
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color("#3b4a5e") }, mid: { value: new THREE.Color("#c79673") }, bot: { value: FOG }, sd: { value: new THREE.Vector3(-0.8, 0.18, 0.45).normalize() } },
  vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
  fragmentShader: "uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform vec3 sd; varying vec3 vP; void main(){ float h=vP.y; vec3 c=mix(mid,top,smoothstep(0.0,0.5,h)); c=mix(bot,c,smoothstep(-0.01,0.1,h)); float s=max(dot(vP,sd),0.0); c+=vec3(1.0,0.75,0.45)*(pow(s,700.0)*1.3+pow(s,10.0)*0.25); gl_FragColor=vec4(c,1.0); }",
}));
sky.renderOrder = -1; scene.add(sky);

function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const tr = mulberry32(3);
const winTex = canvasTex(256, 256, (g) => {
  g.fillStyle = "#fff"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2000; i++) { g.fillStyle = `rgba(0,0,0,${tr() * 0.07})`; g.fillRect(tr() * 256, tr() * 256, 2, 2); }
  for (let x = 0; x < 4; x++) for (let y = 0; y < 4; y++) {
    g.fillStyle = "rgba(0,0,0,0.2)"; g.fillRect(x * 64 + 12, y * 64 + 14, 40, 34);
    g.fillStyle = tr() < 0.18 ? "#e8c58a" : "#2c3138"; g.fillRect(x * 64 + 15, y * 64 + 16, 34, 30);
    g.fillStyle = "rgba(255,255,255,0.12)"; g.fillRect(x * 64 + 31, y * 64 + 16, 2, 30);
    g.fillStyle = "rgba(0,0,0,0.3)"; g.fillRect(x * 64 + 10, y * 64 + 48, 44, 3);
  }
});
const asphTex = canvasTex(128, 128, (g) => { g.fillStyle = "#3c3d3d"; g.fillRect(0, 0, 128, 128); for (let i = 0; i < 1400; i++) { const v = tr(); g.fillStyle = v < 0.5 ? `rgba(0,0,0,${v * 0.3})` : `rgba(255,255,255,${(v - 0.5) * 0.12})`; g.fillRect(tr() * 128, tr() * 128, 1 + tr() * 2, 1 + tr() * 2); } });
const walkTex = canvasTex(128, 128, (g) => { g.fillStyle = "#8f8a82"; g.fillRect(0, 0, 128, 128); for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(0,0,0,${tr() * 0.1})`; g.fillRect(tr() * 128, tr() * 128, 2, 2); } g.fillStyle = "rgba(0,0,0,0.25)"; g.fillRect(0, 0, 128, 2); g.fillRect(0, 0, 2, 128); g.fillRect(0, 64, 128, 1); g.fillRect(64, 0, 1, 128); });
const grassTex = canvasTex(128, 128, (g) => { g.fillStyle = "#56603a"; g.fillRect(0, 0, 128, 128); for (let i = 0; i < 1800; i++) { const v = tr(); g.fillStyle = v < 0.5 ? `rgba(20,30,10,${v * 0.4})` : `rgba(200,210,140,${(v - 0.5) * 0.2})`; g.fillRect(tr() * 128, tr() * 128, 1, 2 + tr() * 2); } });
const crateTex = canvasTex(64, 64, (g) => { g.fillStyle = "#fff"; g.fillRect(0, 0, 64, 64); g.fillStyle = "rgba(0,0,0,0.18)"; for (let y = 0; y < 64; y += 8) g.fillRect(0, y, 64, 1); g.fillStyle = "rgba(0,0,0,0.4)"; g.fillRect(0, 0, 64, 3); g.fillRect(0, 61, 64, 3); g.fillRect(0, 0, 3, 64); g.fillRect(61, 0, 3, 64); });

// ================= city =================
// Deterministic from a fixed seed, so every player on every machine walks the same streets.
const lam = (c, extra) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, extra || {}));
const ROADS = [-225, -150, -75, 0, 75, 150, 225], RW = 12, BOUND = 238;
const boxes = []; // collision + bullet blockers: {x0,x1,z0,z1,y1}
const GRID = 16, grid = new Map();
function addBox(x0, x1, z0, z1, y1) {
  const b = { x0, x1, z0, z1, y1 }; boxes.push(b);
  for (let gx = Math.floor(x0 / GRID); gx <= Math.floor(x1 / GRID); gx++) for (let gz = Math.floor(z0 / GRID); gz <= Math.floor(z1 / GRID); gz++) {
    const k = gx * 1000 + gz; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(b);
  }
  return b;
}
function boxesNear(x, z) { const out = new Set(); const gx = Math.floor(x / GRID), gz = Math.floor(z / GRID); for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { const l = grid.get((gx + i) * 1000 + gz + j); if (l) for (const b of l) out.add(b); } return out; }
function uvBox(geo, w, h, d, cw, ch) {
  const uv = geo.attributes.uv;
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) { const i = f * 4 + k; let u = uv.getX(i), v = uv.getY(i); if (f === 2 || f === 3) { u = 0.01; v = 0.97; } else { u *= (f < 2 ? d : w) / cw; v *= h / ch; } uv.setXY(i, u, v); }
}
function solid(cx, cz, w, h, d, mat, cw = 4, ch = 4, y0 = 0) {
  const g = new THREE.BoxGeometry(w, h, d); if (mat.map) uvBox(g, w, h, d, cw, ch);
  const m = new THREE.Mesh(g, mat); m.position.set(cx, y0 + h / 2, cz); scene.add(m);
  addBox(cx - w / 2, cx + w / 2, cz - d / 2, cz + d / 2, y0 + h);

function join() {

function resume() { state = "play"; $("menu").hidden = true; $("hud").hidden = false; requestLock(); }

// ================= main loop =================
const grainCanvas = document.createElement("canvas"); grainCanvas.width = grainCanvas.height = 128;
{ const g = grainCanvas.getContext("2d"), img = g.createImageData(128, 128); for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; } g.putImageData(img, 0, 0); $("grain").style.backgroundImage = `url(${grainCanvas.toDataURL()})`; }
let hudT = 0, bob = 0, aloneT = 0;
function update(dt) {

  adsT = clamp(adsT + (adsHeld && !P.car && !P.dead && !reloadEnd ? dt : -dt) / 0.16, 0, 1);
  const w = WEAPONS[wIdx];
  if (reloadEnd && T >= reloadEnd) { ammo[wIdx] = w.mag; reloadEnd = 0; }
  if (triggerHeld || triggerFresh) { if (w.auto || triggerFresh) fire(); triggerFresh = false; }

  if (P.car) {
    const c = P.car, back = new V3(Math.sin(c.yaw) * 7.5, 3.2, Math.cos(c.yaw) * 7.5);
    const want = new V3(c.x, 0, c.z).add(back);

  } else if (P.dead && P.killer) {
    const k = P.killer.isBot ? P.killer.rpos : avatarBase(P.killer);
    camera.position.set(P.pos.x, P.pos.y + 0.6, P.pos.z); camera.lookAt(k.x, k.y + 1.4, k.z);
  } else {
    const b = Math.sin(bob) * 0.04 * (1 - adsT);

    camera.rotation.set(P.pitch + recoilP, P.yaw + recoilY, 0);
    camera.fov += (75 + (w.adsFov - 75) * adsT + (keys.ShiftLeft && keys.KeyW && !P.crouch ? 4 : 0) - camera.fov) * Math.min(1, dt * 14);
  }

  vm.position.z += recoilP * 2.2;
  vm.rotation.x = reloadEnd ? -0.6 : 0; vm.rotation.y = T - knifeT < 0.25 ? 0.6 : 0;

  $("scope").hidden = !(w.scope && adsT > 0.85) || !!P.car || P.dead;
  if (flashT > 0) { flashT -= dt; if (flashT <= 0) flash.visible = false; }
  updateBots(dt);
  for (const a of remotes.values()) animateAvatar(a, dt);
  updateRemoteCars(dt);
  for (const a of [...remotes.values(), ...bots]) a.tag.visible = !a.dead && a.rpos.distanceTo(P.pos) < 70;
  updateFx(dt);
  pushPresence(false);
  // HUD
  if (hitmT > 0) { hitmT -= dt; if (hitmT <= 0) $("hitm").classList.remove("on"); }
  $("hurt").style.opacity = P.dead ? 0.8 : clamp((100 - P.hp) / 80, 0, 0.85);
  hudT -= dt;
  if (hudT <= 0) {
    hudT = 0.06;
    $("hp").firstElementChild.style.width = Math.max(0, P.hp) + "%";
    $("kd").innerHTML = `K <b>${P.k}</b> · D <b>${P.d}</b> · <b>${P.score}</b> pts`;
    $("wName").textContent = w.name; $("wAmmo").innerHTML = `${ammo[wIdx]} <small>/ ∞</small>`;
    $("wState").textContent = reloadEnd ? "RELOADING" : ammo[wIdx] === 0 ? "R · RELOAD" : P.passive ? "PASSIVE" : "";
    $("weap").hidden = !!P.car; $("carhud").hidden = !P.car; if (P.car) $("kmh").textContent = Math.round(Math.abs(P.car.speed) * 3.6);
    $("xh").hidden = adsT > 0.5 || !!P.car || P.dead; $("dot").hidden = !(adsT > 0.5 && !w.scope && !P.car && !P.dead);
    const sp = 8 + (w.hip * 300) + bloom * 400; const xs = $("xh").children; xs[0].style.top = -sp - 9 + "px"; xs[1].style.top = sp + "px"; xs[2].style.left = -sp - 9 + "px"; xs[3].style.left = sp + "px";
    const near = !P.car && !P.dead ? nearestCar(3.4) : null;
    const pr = $("prompt"); pr.hidden = !(near || P.car); pr.innerHTML = P.car ? "<kbd>E</kbd> Get out" : "<kbd>E</kbd> Drive";
    if (P.car) pr.hidden = true;
    const online = NET.room && NET.status === "online";
    $("srv").innerHTML = `SERVER <b>${esc(mySrv)}</b> · ${remotes.size + 1} PLAYER${remotes.size ? "S" : ""}${bots.length ? " + BOTS" : ""} · <b class="${online ? "" : "off"}">${online ? "ONLINE" : NET.status === "offline" ? "OFFLINE" : "RECONNECTING"}</b>`;
    if (boardOpen) renderBoard();

}
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
window.addEventListener("resize", resize);
let last = performance.now(), menuT = 0, gx = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "play" || state === "paused") update(dt);
  else {
    menuT += dt;
    if (state === "menu") { camera.position.set(Math.sin(menuT * 0.05) * 60, 38, Math.cos(menuT * 0.05) * 60); camera.lookAt(0, 4, 0); camera.fov = 70; camera.updateProjectionMatrix(); }

resize(); buildViewmodel(); showMenu("start"); requestAnimationFrame(frame);
if (location.hash === "#test") window.__cb = { P, remotes, cars, NET, fire: () => { triggerFresh = true; }, get bots() { return bots; }, get state() { return state; }, get T() { return T; } };
})();
