<title>Cold Block</title>
<meta name="description" content="Multiplayer first-person shooter in an open city: join a server with friends, pick up Cold War guns, steal cars.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D view; Cold War field-manual HUD — stencilled condensed caps, olive and signal orange. Single dark look by design. */
:root {
  --ink: #0d0f0c;
  --panel: rgba(16, 18, 14, 0.88);
  --hud: #ece6d6;
  --dim: rgba(236, 230, 214, 0.6);
  --rule: rgba(236, 230, 214, 0.2);
  --signal: #f07d2a;
  --olive: #8d9a5b;
  --red: #d8392b;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--hud); overflow: hidden; }
body { font-family: var(--display); -webkit-user-select: none; user-select: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; filter: contrast(1.08) saturate(0.82) sepia(0.12); }
#grain { position: fixed; inset: -50%; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay; }
#vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%); }
#hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(140,0,0,0.75) 100%); }
#scope { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, transparent 0, transparent calc(min(46vw, 46vh) - 1px), #050505 min(46vw, 46vh)); }
#scope::before, #scope::after { content: ""; position: absolute; background: #050505; }
#scope::before { left: 50%; top: 0; bottom: 0; width: 1px; }
#scope::after { top: 50%; left: 0; right: 0; height: 1px; }

#hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.85); }
#mini { position: absolute; left: 16px; top: 16px; width: 168px; height: 168px; border-radius: 50%; border: 2px solid rgba(236,230,214,0.35); background: #1b1d18; }
#srv { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--dim); white-space: nowrap; }
#srv b { color: var(--olive); font-weight: 500; }
#srv b.off { color: var(--signal); }
#feed { position: absolute; right: 16px; top: 14px; display: grid; gap: 3px; justify-items: end; font-size: 16px; font-weight: 600; letter-spacing: 0.04em; }
#feed div { background: rgba(0,0,0,0.35); padding: 2px 8px; animation: fade 6s forwards; }
#feed .w { font-family: var(--mono); font-size: 12px; color: var(--signal); padding: 0 6px; }
@keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
#chat { position: absolute; left: 16px; bottom: 120px; display: grid; gap: 2px; font-family: var(--mono); font-size: 13px; max-width: min(460px, 70vw); }
#chat div { animation: fade 12s forwards; overflow-wrap: anywhere; }
#chat div.sys { color: var(--dim); }
#chatIn { position: absolute; left: 16px; bottom: 88px; width: min(420px, 70vw); pointer-events: auto; font: 14px var(--mono); color: var(--hud); background: rgba(0,0,0,0.6); border: 1px solid var(--rule); padding: 6px 8px; }
#weap { position: absolute; right: 20px; bottom: 18px; text-align: right; display: grid; gap: 0; }
#weap .n { font-size: 18px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
#weap .a { font-size: 46px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
#weap .a small { font-size: 22px; color: var(--dim); }
#weap .s { font-family: var(--mono); font-size: 12px; color: var(--signal); letter-spacing: 0.1em; min-height: 16px; }
#slots { display: flex; gap: 3px; justify-content: flex-end; flex-wrap: wrap; max-width: 470px; margin-top: 4px; }
#slots span { font-family: var(--mono); font-size: 10px; padding: 1px 4px; border: 1px solid var(--rule); color: var(--dim); }
#slots span.on { border-color: var(--signal); color: var(--hud); }
#stats { position: absolute; left: 20px; bottom: 18px; display: grid; gap: 4px; }
#hp { width: 200px; height: 6px; background: rgba(236,230,214,0.18); }
#hp i { display: block; height: 100%; width: 100%; background: var(--hud); }
#kd { font-family: var(--mono); font-size: 13px; color: var(--dim); }
#kd b { color: var(--hud); font-weight: 500; }
#mode { font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--olive); }
#xh { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#xh i { position: absolute; background: var(--hud); box-shadow: 0 0 2px #000; }
#xh i:nth-child(1), #xh i:nth-child(2) { width: 2px; height: 9px; left: -1px; }
#xh i:nth-child(3), #xh i:nth-child(4) { height: 2px; width: 9px; top: -1px; }
#dot { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: #ff3b2a; box-shadow: 0 0 4px #ff3b2a; }
#hitm { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; transform: translate(-50%,-50%) rotate(45deg); opacity: 0; }
#hitm::before, #hitm::after { content: ""; position: absolute; background: var(--hud); }
#hitm::before { left: 14px; top: 0; width: 2px; height: 30px; clip-path: polygon(0 0,100% 0,100% 33%,0 33%,0 67%,100% 67%,100% 100%,0 100%); }
#hitm::after { top: 14px; left: 0; height: 2px; width: 30px; clip-path: polygon(0 0,33% 0,33% 100%,0 100%,0 0,67% 0,100% 0,100% 100%,67% 100%); }
#hitm.on { opacity: 1; }
#hitm.kill::before, #hitm.kill::after { background: var(--red); }
#center { position: absolute; left: 0; right: 0; top: 60%; display: grid; justify-items: center; gap: 4px; }
.big { font-size: 22px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; animation: rise 1.6s ease-out forwards; }
.big span { color: var(--signal); }
@keyframes rise { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
#prompt { position: absolute; left: 50%; top: 66%; transform: translateX(-50%); font-size: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; background: rgba(0,0,0,0.45); padding: 4px 12px; }
#prompt kbd { font-family: var(--mono); color: var(--signal); }
#nadeWarn { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font-size: 20px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--red); animation: blink 0.4s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
#deathMsg { position: absolute; left: 0; right: 0; top: 34%; text-align: center; display: grid; gap: 6px; }
#deathMsg b { font-size: 44px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
#deathMsg span { font-size: 18px; letter-spacing: 0.1em; color: var(--dim); }
#dirs { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#dirs i { position: absolute; left: -40px; top: -150px; width: 80px; height: 20px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; border-top: 5px solid rgba(216,57,43,0.9); transform-origin: 40px 150px; animation: fade 1.6s forwards; }
#carhud { position: absolute; right: 20px; bottom: 18px; text-align: right; }
#carhud b { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; }
#carhud span { font-size: 16px; letter-spacing: 0.12em; color: var(--dim); }

#board { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); width: min(620px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--rule); padding: 16px 20px; pointer-events: none; }
#board h3 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; }
#board table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
#board th { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: var(--dim); text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--rule); }
#board th:first-child, #board td:first-child { text-align: left; }
#board td { font-size: 18px; font-weight: 600; padding: 4px 6px; text-align: right; }
#board tr.me td { color: var(--signal); }
#board td i { display: inline-block; width: 10px; height: 10px; margin-right: 8px; }

#menu { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 40%, rgba(13,15,12,0.4), rgba(13,15,12,0.92)); overflow: auto; }
.card { width: min(860px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--rule); padding: clamp(18px, 3.5vw, 32px); display: grid; gap: 16px; box-sizing: border-box; -webkit-user-select: text; user-select: text; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--signal); }
.card h1 { margin: 0; font-size: clamp(52px, 11vw, 104px); line-height: 0.85; font-weight: 800; letter-spacing: 0.01em; text-transform: uppercase; }
.card h2 { margin: 4px 0 0; font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.card p { margin: 0; font-size: 17px; line-height: 1.45; color: var(--dim); max-width: 68ch; font-weight: 500; }
.card p strong { color: var(--hud); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.field input[type=text] { font: 600 20px var(--display); letter-spacing: 0.04em; color: var(--hud); background: rgba(236,230,214,0.06); border: 1px solid var(--rule); padding: 10px 12px; min-width: 0; }
.field input[type=text]:focus { outline: none; border-color: var(--signal); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 34px; height: 34px; border: 2px solid transparent; cursor: pointer; }
.swatches button[aria-pressed="true"] { border-color: var(--hud); outline: 2px solid var(--ink); outline-offset: -4px; }
.servers { display: grid; gap: 6px; }
.servers button { display: flex; justify-content: space-between; gap: 12px; font: 600 18px var(--display); letter-spacing: 0.06em; color: var(--hud); background: rgba(236,230,214,0.05); border: 1px solid var(--rule); padding: 8px 12px; cursor: pointer; text-align: left; }
.servers button:hover { border-color: var(--hud); }
.servers button span { font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--olive); }
.servers .empty { font-family: var(--mono); font-size: 13px; color: var(--dim); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 700 17px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--hud); background: rgba(236,230,214,0.05); border: 1px solid var(--rule); padding: 8px 14px; cursor: pointer; }
.seg button:hover { border-color: var(--hud); }
.seg button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); color: var(--ink); }
.hint { font-family: var(--mono); font-size: 12px; color: var(--dim); line-height: 1.5; }
.check { display: flex; gap: 10px; align-items: center; font-size: 17px; color: var(--hud); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--signal); }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 18px; font-size: 16px; color: var(--dim); }
.keys div { display: flex; gap: 10px; }
.keys kbd { font-family: var(--mono); font-size: 12px; color: var(--hud); min-width: 76px; padding-top: 2px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button.go, button.ghost { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; border: 0; padding: 12px 30px; cursor: pointer; }
button.go { color: var(--ink); background: var(--signal); }
button.go:hover { background: #ff9447; }
button.ghost { color: var(--hud); background: transparent; border: 1px solid var(--rule); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--hud); outline-offset: 2px; }
.net { font-family: var(--mono); font-size: 13px; color: var(--dim); }
.net b { font-weight: 500; color: var(--olive); }
.net b.off { color: var(--signal); }
details summary { cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--hud); }
details .keys { margin-top: 10px; }
/* touch controls */
#tc { position: fixed; inset: 0; touch-action: none; -webkit-touch-callout: none; }
#joyBase { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(236,230,214,0.35); background: rgba(0,0,0,0.18); left: 110px; top: calc(100% - 120px); pointer-events: none; opacity: 0.55; }
#joyBase.on { opacity: 1; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(236,230,214,0.55); }
.tcb { position: absolute; width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(236,230,214,0.35); background: rgba(16,18,14,0.5); color: var(--hud); font: 700 12px var(--display); letter-spacing: 0.08em; text-transform: uppercase; touch-action: none; -webkit-user-select: none; user-select: none; padding: 0; }
.tcb.on, .tcb:active { background: rgba(240,125,42,0.55); border-color: var(--signal); }
#tFire { width: 92px; height: 92px; right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); background: rgba(216,57,43,0.45); font-size: 16px; }
#tAim { width: 64px; height: 64px; right: calc(128px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
#tJump { width: 62px; height: 62px; right: calc(32px + env(safe-area-inset-right, 0px)); bottom: calc(158px + env(safe-area-inset-bottom, 0px)); }
#tReload { right: calc(120px + env(safe-area-inset-right, 0px)); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
#tNade { right: calc(190px + env(safe-area-inset-right, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: rgba(141,154,91,0.4); }
#tKnife { right: calc(200px + env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
#tCrouch { right: calc(204px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
#tSwap { right: calc(104px + env(safe-area-inset-right, 0px)); bottom: calc(172px + env(safe-area-inset-bottom, 0px)); }
#tCar { width: 70px; height: 70px; right: calc(26px + env(safe-area-inset-right, 0px)); bottom: calc(232px + env(safe-area-inset-bottom, 0px)); background: rgba(141,154,91,0.55); }
#tTop { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; }
#tTop .tcb { position: static; width: auto; height: 32px; border-radius: 16px; padding: 0 12px; font-size: 12px; }
#rotate { position: fixed; left: 50%; top: 44%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--rule); padding: 10px 16px; font-size: 16px; letter-spacing: 0.06em; pointer-events: none; text-align: center; }
body.touch #weap { top: calc(48px + env(safe-area-inset-top, 0px)); bottom: auto; right: calc(14px + env(safe-area-inset-right, 0px)); }
body.touch #weap .a { font-size: 28px; }
body.touch #weap .n { font-size: 14px; }
body.touch #slots, body.touch #prompt { display: none; }
body.touch #feed { top: calc(28px + env(safe-area-inset-top, 0px)); right: auto; left: 50%; transform: translateX(-50%); justify-items: center; font-size: 13px; }
body.touch #mini { width: 112px; height: 112px; left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); }
body.touch #stats { left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(130px + env(safe-area-inset-top, 0px)); bottom: auto; }
body.touch #hp { width: 112px; }
body.touch #chat { bottom: auto; top: calc(190px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); font-size: 11px; max-width: 40vw; }
body.touch #chatIn { bottom: auto; top: 50px; left: 50%; transform: translateX(-50%); width: min(420px, 80vw); }
body.touch #carhud { bottom: auto; top: calc(48px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); }
body.touch #carhud b { font-size: 34px; }
body.touch #srv { top: calc(6px + env(safe-area-inset-top, 0px)); font-size: 10px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
body.touch #center { top: 30%; }
.joinrow { position: sticky; bottom: calc(-1 * clamp(18px, 3.5vw, 32px)); background: var(--panel); padding-block: 10px; margin-block: -10px; z-index: 1; }
@media (max-height: 520px) {
  .card { gap: 10px; padding: 14px 18px; }
  .card h1 { font-size: 40px; }
  .card p { font-size: 14px; }
  .card > p:first-of-type { display: none; }
  .field input[type=text] { font-size: 17px; padding: 7px 10px; }
  .seg button { font-size: 14px; padding: 6px 10px; }
  .swatches button { width: 28px; height: 28px; }
  button.go, button.ghost { font-size: 17px; padding: 10px 22px; }
}
.invite { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.invite button { font: 700 14px var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--hud); background: transparent; border: 1px solid var(--rule); padding: 7px 12px; cursor: pointer; }
.invite code { font-family: var(--mono); font-size: 12px; color: var(--dim); overflow-wrap: anywhere; -webkit-user-select: all; user-select: all; }
@media (max-width: 640px) { #mini { width: 120px; height: 120px; } #weap .a { font-size: 34px; } #srv { top: 150px; left: 16px; transform: none; } }
/* progression + match HUD */
#xpbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,0.45); }
#xpbar i { display: block; height: 100%; width: 0; background: var(--signal); transition: width 0.4s; }
#xplvl { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--dim); white-space: nowrap; }
#xppop { position: absolute; left: calc(50% + 34px); top: calc(50% + 18px); display: grid; gap: 1px; }
#xppop div { font-weight: 700; font-size: 17px; letter-spacing: 0.06em; animation: xpfade 1.4s forwards; white-space: nowrap; }
#xppop div b { color: #ffd36a; margin-right: 6px; }
@keyframes xpfade { 0% { opacity: 0; transform: translateX(-6px); } 10% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
#medal { position: absolute; left: 50%; top: 21%; transform: translateX(-50%); text-align: center; display: grid; gap: 2px; }
#medal b { font-size: 30px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #ffd36a; animation: medalin 1.3s forwards; }
#medal span { font-family: var(--mono); font-size: 13px; color: var(--hud); }
@keyframes medalin { 0% { opacity: 0; transform: scale(1.6); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
#banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; display: grid; gap: 4px; animation: rise 3.2s ease-out forwards; }
#banner small { font-family: var(--mono); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--signal); }
#banner b { font-size: 46px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
#banner span { font-size: 18px; color: var(--dim); letter-spacing: 0.06em; }
#matchbar { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
#matchbar .t { font-family: var(--mono); font-size: 18px; background: rgba(0,0,0,0.4); padding: 1px 8px; }
#matchbar .sc { font-size: 22px; font-weight: 800; padding: 0 10px; min-width: 30px; text-align: center; }
#matchbar .lim { font-family: var(--mono); font-size: 11px; color: var(--dim); }
#streaks { display: flex; gap: 6px; margin-top: 2px; }
#streaks span { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border: 1px solid var(--rule); color: var(--dim); }
#streaks span.ready { border-color: #ffd36a; color: #ffd36a; animation: blink 0.8s steps(2) infinite; }
#streaks span.got { border-color: var(--olive); color: var(--hud); }
#buffs { font-family: var(--mono); font-size: 12px; color: #ffd36a; letter-spacing: 0.1em; }
#endScreen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,9,7,0.72); pointer-events: none; padding: 16px; }
#endScreen .box { width: min(640px, 100%); display: grid; gap: 12px; text-align: center; }
#endScreen h2 { margin: 0; font-size: clamp(48px, 10vw, 86px); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; line-height: 0.9; }
#endScreen h2.win { color: #ffd36a; } #endScreen h2.lose { color: var(--red); }
