              <g class="mito">
                <rect x="-230" y="-120" width="90" height="38" rx="19" fill="#b98a3e" stroke="#14233d" stroke-width="2" transform="rotate(-25 -185 -101)" />
                <rect x="140" y="60" width="90" height="38" rx="19" fill="#b98a3e" stroke="#14233d" stroke-width="2" transform="rotate(35 185 79)" />
                <rect x="-60" y="170" width="80" height="34" rx="17" fill="#b98a3e" stroke="#14233d" stroke-width="2" />
              </g>
              <circle class="nucleus" r="88" fill="#e0241b" stroke="#14233d" stroke-width="3" />
              <circle r="52" fill="none" stroke="#f4b3ad" stroke-width="3" class="noline" />
            </g>
          </g>
          <!-- loupe rim on top of the tissue -->
          <g class="loupe" opacity="0">
            <path d="M 0 -1420 A 1420 1420 0 1 1 0 1420 A 1420 1420 0 1 1 0 -1420 Z M 0 -1300 A 1300 1300 0 1 0 0 1300 A 1300 1300 0 1 0 0 -1300 Z" fill="#b98a3e" fill-rule="evenodd" stroke="#14233d" stroke-width="3" />
          </g>

          <!-- the red pin: "you are here" on the planet -->
          <g class="r-pin" opacity="0" transform="scale(1296) translate(-2.7778 7.7778)">
            <circle r="16" fill="none" stroke="#e0241b" stroke-width="6" class="noline" />
            <circle r="6" fill="#e0241b" class="noline" />
          </g>
        </g>
      </g>
      <g id="lad-lines"></g>

      <!-- tissue cell prototype (not rendered on its own) -->
      <defs>
        <g id="lad-cellproto">
          <circle r="300" fill="#ebe8de" stroke="#14233d" stroke-width="3" vector-effect="non-scaling-stroke" />
          <circle r="300" fill="url(#hd-sage)" opacity="0.45" mask="url(#m-cell)" />
          <circle r="80" fill="#a9c5ae" stroke="#14233d" stroke-width="2" vector-effect="non-scaling-stroke" />
        </g>
      </defs>
    </svg>

    <h1 id="lad-title" class="clip" data-start="0.3" data-duration="2.3" data-track-index="3">
      <span>How</span><span>small</span><span>is</span><span>the</span><span>smallest</span><span>part</span><span>of</span><span>you?</span>
    </h1>
    <div id="lad-tag" class="clip" data-start="4.15" data-duration="1.5" data-track-index="4">
      <div id="lad-tag-in">ONE CELL</div>
    </div>
    <div id="lad-readout" class="clip" data-start="2.6" data-duration="5.55" data-track-index="5">
      <div id="lad-readout-in">
        <div id="lad-name">YOU · 1.7 M</div>
        <div class="big">≈ 10<sup id="lad-exp">0</sup> m</div>
        <div id="lad-jump">ZOOM NOT TO SCALE</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ---- the line pass is a clone of the art (built once, before the timeline) ----
      const fills = document.querySelector("#lad-fills");
      const lines = document.querySelector("#lad-lines");
      const proto = document.querySelector("#lad-cellproto");
      fills.querySelectorAll("use").forEach((u) => {
        const g = proto.cloneNode(true);
        g.removeAttribute("id");
        u.replaceWith(g);
      });
      lines.appendChild(fills.querySelector(".art").cloneNode(true));

      // ---- camera: zoom z (camera scale 6^-z) and focus blend; a pure function of scene time ----
      const E = (n) => gsap.parseEase(n);
      const lerp = (a, b, p) => a + (b - a) * p;
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const seg = (t, t0, t1, ease) => E(ease)(clamp01((t - t0) / (t1 - t0)));
      function zAt(t) {
        if (t < 2.6) return 2;
        if (t < 4.1) return lerp(2, 0, seg(t, 2.6, 4.1, "expo.inOut"));
        if (t < 4.8) return 0;
        if (t < 6.4) return lerp(0, 3, seg(t, 4.8, 6.4, "power2.inOut"));
        if (t < 7.0) return lerp(3, 3.08, seg(t, 6.4, 7.0, "sine.inOut"));
        if (t < 7.55) return lerp(3.08, 4, seg(t, 7.0, 7.55, "power2.inOut"));
        if (t < 7.75) return 4;
        return lerp(4, 5.62, seg(t, 7.75, 8.15, "power3.in"));
      }
      const WC = [-3600, -720 - 130 * 36], PC = [-3600, 502560];
      const ramp = (z, a, b) => clamp01((z - a) / (b - a));
      const NAMES = ["ONE CELL · 0.01 MM", "TISSUE · 1 MM", "YOU · 1.7 M", "A CITY · 10 KM", "EARTH · 12,742 KM"];
      const SHORT = ["CELL", "TISSUE", "YOU", "CITY", "EARTH"];
      // the drawing steps x6 per rung; the real jumps are much bigger, so we say so on screen
      const JUMP = ["REAL JUMP ×100", "REAL JUMP ×1,700", "REAL JUMP ×6,000", "REAL JUMP ×1,300"];
      const EXP = [-5, -3, 0, 4, 7];
      const all = (sel) => document.querySelectorAll("#lad-svg " + sel);
      const groups = {
        tissue: all(".r-tissue"), winder: all(".r-winder"), city: all(".r-city"), planet: all(".r-planet"),
      };
      const setOp = (list, v) => list.forEach((el) => el.setAttribute("opacity", v.toFixed(3)));
      const expEl = document.querySelector("#lad-exp");
      const nameEl = document.querySelector("#lad-name");
      const jumpEl = document.querySelector("#lad-jump");

      function draw(t) {
        const z = zAt(t);
        const a = 1 - seg(t, 2.6, 4.1, "expo.inOut");
        const b = seg(t, 7.0, 7.55, "power2.inOut");
        const s = Math.pow(6, -z);
        const fx = WC[0] * a + PC[0] * b, fy = WC[1] * a + PC[1] * b;
        const tr = `translate(960 540) scale(${s}) translate(${-fx} ${-fy})`;
        lines.setAttribute("transform", tr);
        fills.setAttribute("transform", "translate(4 3) " + tr);
        setOp(groups.tissue, 1 - ramp(z, 1.6, 2.0));
        setOp(groups.winder, ramp(z, 0.9, 1.4) * (1 - ramp(z, 3.3, 3.7)));
        setOp(groups.city, ramp(z, 2.2, 2.6));
        setOp(groups.planet, ramp(z, 2.3, 2.7));
        // kinetic readout: the exponent rolls with the zoom
        const zi = Math.max(0, Math.min(3.999, z));
        const k = Math.floor(zi);
        let e2 = Math.round(lerp(EXP[k], EXP[k + 1], zi - k));
        const zc = Math.max(0, Math.min(4, z)), kn = Math.round(zc);
        if (Math.abs(zc - kn) < 0.15) { nameEl.textContent = NAMES[kn]; e2 = EXP[kn]; }
        else { const k0 = Math.floor(zc); nameEl.textContent = SHORT[k0] + " → " + SHORT[k0 + 1]; }
        expEl.textContent = e2 < 0 ? "−" + Math.abs(e2) : String(e2);
        const kj = Math.max(0, Math.min(3, Math.floor(zc - 0.15 < 0 ? 0 : zc - 0.15)));
        jumpEl.textContent = "ZOOM NOT TO SCALE · " + JUMP[kj];
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: 8.2, duration: 8.2, ease: "none", onUpdate: () => draw(clock.t) }, 0);

      // ---- character acting, sampled on twos (15 fps) ----
      const twos = (name, dur) => {
        const f = E(name), n = Math.max(1, Math.round(dur * 15));
        return (p) => f(Math.min(1, Math.floor(p * n + 1e-6) / n));
      };
      const rig = all(".w-rig"), breath = all(".w-breath"), head = all(".w-head"), arm = all(".w-arm");
      const key = all(".w-key"), shadow = all(".w-shadow");
      const O = { svgOrigin: "0 0" };
      // breathing idle (a character's breath is acting)
      tl.fromTo(breath, { scaleY: 1, ...O }, { scaleY: 1.015, ...O, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
      // hop: anticipation, stretch, fall, squash, settle (8% squash budget)
      tl.fromTo(rig, { scaleX: 1, scaleY: 1, y: 0, ...O }, { scaleX: 1.08, scaleY: 0.92, ...O, duration: 0.12, ease: twos("power2.out", 0.12) }, 0.7);
      tl.fromTo(rig, { scaleX: 1.08, scaleY: 0.92, y: 0, ...O }, { scaleX: 0.95, scaleY: 1.06, y: -90, ...O, duration: 0.26, ease: twos("power2.out", 0.26) }, 0.82);
      tl.fromTo(rig, { scaleX: 0.95, scaleY: 1.06, y: -90, ...O }, { scaleX: 1, scaleY: 1, y: 0, ...O, duration: 0.2, ease: twos("power2.in", 0.2) }, 1.08);
      tl.fromTo(rig, { scaleX: 1, scaleY: 1, ...O }, { scaleX: 1.07, scaleY: 0.93, ...O, duration: 0.07, ease: "none" }, 1.28);
      tl.fromTo(rig, { scaleX: 1.07, scaleY: 0.93, ...O }, { scaleX: 1, scaleY: 1, ...O, duration: 0.2, ease: "back.out(2)" }, 1.35);
      tl.fromTo(shadow, { scaleX: 1, svgOrigin: "0 2" }, { scaleX: 0.7, svgOrigin: "0 2", duration: 0.26, ease: "power2.out" }, 0.82);
      tl.fromTo(shadow, { scaleX: 0.7, svgOrigin: "0 2" }, { scaleX: 1, svgOrigin: "0 2", duration: 0.2, ease: "power2.in" }, 1.08);
      // looks up at the question, points at it (head leads, arm follows 3 frames later)
      tl.fromTo(head, { rotation: 0, svgOrigin: "0 -470" }, { rotation: -10, svgOrigin: "0 -470", duration: 0.27, ease: twos("power2.inOut", 0.27) }, 1.5);
      tl.fromTo(arm, { rotation: 0, svgOrigin: "100 -380" }, { rotation: -150, svgOrigin: "100 -380", duration: 0.33, ease: twos("back.out(1.4)", 0.33) }, 1.55);
      tl.fromTo(head, { rotation: -10, svgOrigin: "0 -470" }, { rotation: 4, svgOrigin: "0 -470", duration: 0.27, ease: twos("power2.inOut", 0.27) }, 2.12);
      tl.fromTo(arm, { rotation: -150, svgOrigin: "100 -380" }, { rotation: 0, svgOrigin: "100 -380", duration: 0.27, ease: twos("power2.in", 0.27) }, 2.15);
      // the key ticks while it thinks: 45 degree steps every 0.1 s with a micro-overshoot (on ones)
      // a wind-up key turns about its own shaft: seen side-on that is a stepped flip, scaleY = cos(angle)
      for (let i = 0; i < 78; i++) {
        const c0 = Math.cos((i * Math.PI) / 4), c1 = Math.cos(((i + 1) * Math.PI) / 4);
        tl.fromTo(key, { scaleY: c0, svgOrigin: "-110 -430" }, { scaleY: c1, svgOrigin: "-110 -430", duration: 0.08, ease: "back.out(3)", immediateRender: i === 0 }, 0.1 + i * 0.1);
      }
      // mitochondria idle in the hero cell (something always ticks)
      tl.fromTo(all(".mito"), { rotation: 0, svgOrigin: "0 0" }, { rotation: 8, svgOrigin: "0 0", duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 4.1);

      // ---- the loupe arrives on the arm, then leaves on the pull-out ----
      tl.fromTo(all(".loupe"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 2.42);
      tl.fromTo(all(".loupe"), { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in" }, 6.0);
      tl.fromTo(all(".r-pin"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 7.45);

      // ---- type: per-word blur-in, no translate; exit blur-out ----
      const words = document.querySelectorAll("#lad-title span");
      words.forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" }, 0.35 + i * 0.067);
        tl.fromTo(w, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in", immediateRender: false }, 2.3 + i * 0.02);
      });
      tl.fromTo("#lad-tag-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out" }, 4.15);
      tl.fromTo("#lad-tag-in", { opacity: 1 }, { opacity: 0, duration: 0.13, ease: "power2.in", immediateRender: false }, 5.5);
      tl.fromTo("#lad-readout-in", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 2.7);
      tl.fromTo("#lad-readout-in", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, 7.7);

      // seek baseline: render to the end and back once, so every element rests on its EARLIEST from-state
      tl.progress(1).progress(0);
      draw(0);
      window.__timelines["ladder"] = tl;
    })();
  </script>
</template>
