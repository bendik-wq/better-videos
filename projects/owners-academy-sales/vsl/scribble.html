<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Marker;src:url(fonts/PermanentMarker.woff2)}
@font-face{font-family:Caveat;src:url(fonts/Caveat-Bold.woff2);font-weight:700}
@font-face{font-family:Inter;src:url(fonts/Inter-Medium.otf);font-weight:500}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
svg{position:absolute;inset:0}
.lab{position:absolute;right:56px;bottom:36px;font:500 22px Inter;color:rgba(255,255,255,.75);letter-spacing:.04em;background:rgba(11,18,32,.6);padding:10px 16px;border-radius:8px}
</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg><div class="lab" id="lab"></div>
<script>
/* White hand-drawn doodles for the top-left corner. render(t) draws the frame at t seconds.
   Every stroke is re-jittered 8x a second ("boil") so it reads as hand-animated, and draws on via its dash offset. */
const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('s'), lab = document.getElementById('lab');
const clamp = (x) => Math.max(0, Math.min(1, x)), ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
// a wobbly path through points (Catmull-Rom), each point nudged by up to j px
function wob(pts, j, seed) {
  const r = rng(seed), q = pts.map(([x, y]) => [x + (r() - .5) * 2 * j, y + (r() - .5) * 2 * j]);
  let d = `M${q[0][0]},${q[0][1]}`;
  for (let i = 0; i < q.length - 1; i++) {
    const p0 = q[Math.max(0, i - 1)], p1 = q[i], p2 = q[i + 1], p3 = q[Math.min(q.length - 1, i + 2)];
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
  }
  return d;
}
const ellipse = (cx, cy, rx, ry, turns = 1.12, n = 28, a0 = -2.2) => Array.from({ length: n + 1 }, (_, i) => {
  const a = a0 + (i / n) * turns * 2 * Math.PI, k = 1 + 0.06 * Math.sin(i * 1.7);
  return [cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k];
});
function stroke(d, w, p, op = 1) {
  const el = document.createElementNS(NS, 'path');
  el.setAttribute('d', d); el.setAttribute('fill', 'none'); el.setAttribute('stroke', '#fff');
  el.setAttribute('stroke-width', w); el.setAttribute('stroke-linecap', 'round'); el.setAttribute('stroke-linejoin', 'round');
  el.style.filter = 'drop-shadow(0 2px 6px rgba(0,0,0,.35))'; el.style.opacity = op;
  svg.appendChild(el);
  const L = el.getTotalLength(); el.style.strokeDasharray = L; el.style.strokeDashoffset = L * (1 - ease(p));
}
function text(str, x, y, size, font, rot, p, op = 1, wt = 400) {
  const el = document.createElementNS(NS, 'text');
  el.textContent = str; el.setAttribute('x', x); el.setAttribute('y', y); el.setAttribute('fill', '#fff');
  el.setAttribute('font-family', font); el.setAttribute('font-size', size); el.setAttribute('font-weight', wt);
  el.setAttribute('transform', `rotate(${rot} ${x} ${y})`);
  el.style.filter = 'drop-shadow(0 2px 6px rgba(0,0,0,.35))'; el.style.opacity = op;
  // write-on: reveal left to right with a clip
  const id = 'c' + Math.random().toString(36).slice(2), cp = document.createElementNS(NS, 'clipPath'), rc = document.createElementNS(NS, 'rect');
  cp.id = id; rc.setAttribute('x', x - 20); rc.setAttribute('y', y - size * 1.2); rc.setAttribute('height', size * 1.6);
  rc.setAttribute('width', (str.length * size * 0.62 + 40) * ease(p)); rc.setAttribute('transform', `rotate(${rot} ${x} ${y})`);
  cp.appendChild(rc); svg.appendChild(cp); el.setAttribute('clip-path', `url(#${id})`); svg.appendChild(el);
}
const star = (cx, cy, r) => [[cx, cy - r], [cx + r * .18, cy - r * .18], [cx + r, cy], [cx + r * .18, cy + r * .18], [cx, cy + r], [cx - r * .18, cy + r * .18], [cx - r, cy], [cx - r * .18, cy - r * .18], [cx, cy - r]];

// Josh's head in the long-form panel (1080p frame): centre ~ (410, 470)
const HX = 410, HY = 470;
const STYLES = [
  ['A · Marker circle + arrow', (lt, b) => {
    stroke(wob(ellipse(HX, HY, 150, 175), 3, b), 7, (lt - .2) / .8);
    stroke(wob([[150, 165], [195, 215], [240, 262], [272, 300]], 3, b + 1), 7, (lt - .9) / .45);
    stroke(wob([[244, 300], [274, 304], [272, 272]], 2, b + 2), 7, (lt - 1.3) / .25);
    text('this guy', 118, 128, 46, 'Marker', -8, (lt - 1.5) / .6);
  }],
  ['B · Sparkle pop', (lt, b) => {
    const S = [[255, 300, 34, 0], [305, 215, 22, .25], [195, 385, 18, .5], [360, 185, 14, .7]];
    S.forEach(([x, y, r, d], i) => {
      const p = lt - .2 - d, sc = p < 0 ? 0 : 1 + .35 * Math.exp(-p * 6) * Math.sin(p * 18);
      const pts = star(x, y, r * sc);
      stroke(wob(pts, 1.5, b + i), 5, p / .35);
    });
    [[[165, 285], [125, 270]], [[175, 325], [137, 340]], [[195, 250], [170, 220]]].forEach((l, i) => stroke(wob(l, 2, b + 10 + i), 5, (lt - .9 - i * .08) / .25));
  }],
  ['C · Handwritten note', (lt, b) => {
    text('stuck at $5M?', 112, 165, 64, 'Caveat', -6, (lt - .2) / 1.0, 1, 700);
    stroke(wob([[118, 190], [170, 184], [220, 192], [270, 183], [330, 190], [380, 182], [430, 188]], 2.5, b), 6, (lt - 1.2) / .5);
    stroke(wob([[440, 205], [462, 245], [452, 285], [428, 315]], 2.5, b + 1), 6, (lt - 1.6) / .4);
    stroke(wob([[418, 299], [426, 319], [448, 311]], 2, b + 2), 6, (lt - 1.95) / .2);
  }],
  ['D · Crown', (lt, b) => {
    const y = HY - 205, x = HX - 95;
    stroke(wob([[x, y + 70], [x + 10, y + 10], [x + 55, y + 50], [x + 95, y], [x + 135, y + 50], [x + 180, y + 10], [x + 190, y + 70], [x, y + 70]], 2.5, b), 7, (lt - .2) / .9);
    [[x + 10, y + 2], [x + 95, y - 10], [x + 180, y + 2]].forEach(([cx, cy], i) => stroke(wob(ellipse(cx, cy, 9, 9, 1.05, 10), 1, b + 3 + i), 5, (lt - 1.1 - i * .1) / .25));
    [[[x - 50, y + 20], [x - 20, y + 30]], [[x - 55, y + 55], [x - 22, y + 55]], [[x + 230, y + 20], [x + 205, y + 30]]].forEach((l, i) => stroke(wob(l, 2, b + 8 + i), 5, (lt - 1.5 - i * .08) / .2));
  }],
  ['E · Emphasis burst', (lt, b) => {
    for (let i = 0; i < 9; i++) {
      const a = -2.9 + i * 0.26, r0 = 195, r1 = 245 + (i % 2) * 25;
      stroke(wob([[HX + Math.cos(a) * r0, HY + Math.sin(a) * r0 * 1.1], [HX + Math.cos(a) * r1, HY + Math.sin(a) * r1 * 1.1]], 2, b + i), 6, (lt - .2 - i * .05) / .2);
    }
    text('!!', 130, 200, 90, 'Marker', -10, (lt - 1.0) / .3);
  }],
];
const SEG = 6.0, START = 1.0, OUT = 0.35;
window.ready = Promise.all([document.fonts.load('46px Marker'), document.fonts.load('700 64px Caveat'), document.fonts.load('500 22px Inter')]);
window.render = (t) => {
  svg.innerHTML = '';
  const k = Math.floor((t - START) / SEG);
  if (t < START || k >= STYLES.length) { lab.style.opacity = 0; return; }
  const lt = t - START - k * SEG, b = 1000 * k + Math.floor(t * 8) * 7;   // boil: new jitter 8x a second
  const fade = clamp((SEG - lt) / OUT);
  STYLES[k][1](lt, b);
  svg.style.opacity = fade;
  lab.textContent = 'Style ' + STYLES[k][0]; lab.style.opacity = clamp(lt / .3) * fade;
};
</script></body></html>
